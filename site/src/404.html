<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bead: not found</title>
    <meta name="description" content="No page of Bead's at this address." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
{{stack}}

      /* its scheme the system's, since it runs no script */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 2.5rem;
        padding: 2rem 1rem;
        box-sizing: border-box;
        background: var(--app-paper);
        color: var(--app-text);
        font: 1rem/1.6 var(--app-font-body);
      }
      h1 {
        margin: 0 0 0.25rem;
        font: 600 1.75rem/1.2 var(--app-font-display);
      }
      p {
        margin: 0;
        color: var(--app-text-secondary);
      }
      a {
        color: var(--app-accent);
      }
    </style>
  </head>
  <body>
    <section>
      <h1>Not found</h1>
      <p>No page of Bead’s is at this address. <a href="/?lng=en" hreflang="en">Bead’s page</a></p>
    </section>
    <section lang="fr-CA">
      <h1>Page introuvable</h1>
      <p>Aucune page de Bead n’est à cette adresse. <a href="/?lng=fr" hreflang="fr">La page de Bead</a></p>
    </section>
  </body>
