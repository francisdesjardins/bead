# The release is vendored rather than resolved from the machine: Node 26 unbundled Corepack, so
# `yarn` on PATH here is a 1.22 that refuses to run a project declaring yarn@4. `yarnPath` makes
# every `yarn` in this project run the file below, whatever is installed globally.
# no dependency runs a script as it installs, but those package.json lets by dependenciesMeta
enableScripts: false

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.1.cjs
