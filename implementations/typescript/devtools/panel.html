<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bead</title>
    <style>
      :root {
        --paper: #ffffff;
        --raised: #f3f5f4;
        --ink: #1f2623;
        --muted: #5f6b66;
        --faint: #8a9590;
        --line: #dfe4e2;
        --accent: #0b6e5a;
        --accent-soft: rgb(11 110 90 / 0.1);
        --answered: #1a73e8;
        --answered-soft: rgb(26 115 232 / 0.12);
        --bad: #c5221f;
        --bad-soft: rgb(197 34 31 / 0.1);
        --ended: #80868b;
        --added: rgb(30 142 62 / 0.14);
        --removed: rgb(197 34 31 / 0.12);
        --mono: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
        color-scheme: light;
        font:
          12px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }

      :root[data-theme='dark'] {
        --paper: #202124;
        --raised: #292a2d;
        --ink: #e3e6e4;
        --muted: #9aa5a0;
        --faint: #747d79;
        --line: #3c4043;
        --accent: #3cc7a6;
        --accent-soft: rgb(60 199 166 / 0.14);
        --answered: #8ab4f8;
        --answered-soft: rgb(138 180 248 / 0.16);
        --bad: #f28b82;
        --bad-soft: rgb(242 139 130 / 0.14);
        --ended: #9aa0a6;
        --added: rgb(129 201 149 / 0.16);
        --removed: rgb(242 139 130 / 0.16);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        height: 100vh;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
      }

      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        padding: 5px 8px;
        border-bottom: 1px solid var(--line);
        background: var(--raised);
      }

      select,
      input,
      button {
        min-height: 22px;
        padding: 1px 6px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--paper);
        color: var(--ink);
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      button[aria-pressed='true'] {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      #record[aria-pressed='true'] {
        color: var(--bad);
      }

      #filter {
        flex: 1 1 220px;
        min-width: 0;
        font-family: var(--mono);
      }

      #filter[aria-invalid='true'] {
        border-color: var(--bad);
        background: var(--bad-soft);
      }

      #filter-state {
        color: var(--bad);
      }

      #filter-state:empty {
        display: none;
      }

      .group {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 2px;
      }

      label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }

      #status {
        margin-left: auto;
        color: var(--muted);
      }

      #status[data-state='open'] {
        color: var(--accent);
      }

      .tabs {
        display: flex;
        gap: 2px;
        padding: 0 8px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
      }

      .tabs button {
        min-height: 26px;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        background: none;
        color: var(--muted);
      }

      .tabs button[aria-selected='true'] {
        border-bottom-color: var(--accent);
        color: var(--ink);
      }

      main {
        min-height: 0;
        overflow: hidden;
      }

      [data-view] {
        height: 100%;
        overflow: auto;
      }

      [data-view][hidden] {
        display: none;
      }

      [data-view].page-gone .rows {
        opacity: 0.6;
      }

      .split {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(260px, 2fr);
        overflow: hidden;
      }

      .split > div {
        min-height: 0;
        overflow: auto;
      }

      .detail {
        border-left: 1px solid var(--line);
      }

      .rows {
        container-type: inline-size;
      }

      @container (max-width: 760px) {
        .wide {
          display: none;
        }
      }

      @container (max-width: 520px) {
        .mid {
          display: none;
        }
      }

      @media (max-width: 720px) {
        .split {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: minmax(0, 3fr) minmax(0, 2fr);
        }

        .detail {
          border-top: 1px solid var(--line);
          border-left: 0;
        }
      }

      .list-bar {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
        color: var(--muted);
      }

      .list-bar .chip {
        cursor: pointer;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font: 11.5px/1.5 var(--mono);
        font-variant-numeric: tabular-nums;
      }

      th {
        position: sticky;
        top: 29px;
        padding: 2px 6px;
        border-bottom: 1px solid var(--line);
        background: var(--raised);
        color: var(--muted);
        font:
          600 11px system-ui,
          sans-serif;
        text-align: left;
        white-space: nowrap;
      }

      td {
        padding: 1px 6px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      td.outcome {
        width: 100%;
        min-width: 120px;
        max-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      td.num,
      th.num {
        text-align: right;
      }

      tr.call {
        cursor: pointer;
      }

      tr.call.failed td.outcome,
      tr.call.failed td.name {
        color: var(--bad);
      }

      tr.call[aria-selected='true'] td {
        background: var(--accent-soft);
      }

      tr.envelope td {
        color: var(--muted);
        background: var(--raised);
      }

      tr.envelope td.name {
        padding-left: 28px;
      }

      tr.marker td {
        padding: 2px 8px;
        color: var(--muted);
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      tr.marker.gap td {
        color: var(--bad);
        background: var(--bad-soft);
      }

      tr[data-direction='tx'].flat td {
        color: var(--muted);
      }

      .twist {
        width: 16px;
        min-height: 0;
        padding: 0;
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 9px;
      }

      .twist[aria-expanded='true'] {
        transform: rotate(90deg);
      }

      .tag {
        margin-left: 6px;
        padding: 0 4px;
        border-radius: 3px;
        background: var(--raised);
        color: var(--muted);
        font-size: 10.5px;
      }

      .status {
        display: inline-block;
        width: 12px;
        height: 12px;
        vertical-align: -2px;
      }

      .wf {
        position: relative;
        width: 120px;
        height: 10px;
      }

      .wf i {
        position: absolute;
        top: 2px;
        height: 6px;
        min-width: 2px;
        border-radius: 1px;
        background: var(--answered);
      }

      .wf i.failed {
        background: var(--bad);
      }

      .wf i.ended {
        border: 1px dashed var(--ended);
        background: none;
      }

      .wf i.flight {
        background: var(--answered-soft);
        box-shadow: inset 0 0 0 1px var(--answered);
      }

      .wf i.open,
      .wf i.closed {
        top: 4px;
        height: 2px;
        background: var(--muted);
      }

      .wf b {
        position: absolute;
        top: 1px;
        width: 1px;
        height: 8px;
        background: var(--ink);
      }

      .detail-tabs {
        position: sticky;
        top: 0;
        display: flex;
        gap: 2px;
        padding: 0 6px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
      }

      .detail-tabs button {
        min-height: 26px;
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        background: none;
        color: var(--muted);
      }

      .detail-tabs button[aria-selected='true'] {
        border-bottom-color: var(--accent);
        color: var(--ink);
      }

      #detail {
        padding: 8px 10px;
      }

      .title {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        font-weight: 650;
      }

      .facts {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 3px 10px;
        margin: 0;
      }

      .facts dt {
        color: var(--muted);
      }

      .facts dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .outcome-box {
        margin-top: 10px;
        padding: 6px 8px;
        border-left: 3px solid var(--answered);
        background: var(--raised);
      }

      .outcome-box.failed {
        border-color: var(--bad);
      }

      .outcome-box.ended {
        border-color: var(--ended);
      }

      h3 {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 10px 0 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
      }

      h3 .spacer {
        flex: 1;
      }

      .link {
        min-height: 0;
        padding: 0 4px;
        border: 0;
        background: none;
        color: var(--accent);
        font-size: 11px;
      }

      pre {
        margin: 0;
        padding: 6px 8px;
        overflow: auto;
        border-radius: 4px;
        background: var(--raised);
        font: 11px/1.5 var(--mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .tree {
        padding: 4px 8px;
        border-radius: 4px;
        background: var(--raised);
        font: 11px/1.6 var(--mono);
      }

      .tree details {
        margin: 0;
        padding-left: 14px;
      }

      .tree summary {
        margin-left: -14px;
        color: var(--ink);
        cursor: pointer;
      }

      .tree .leaf {
        padding-left: 0;
      }

      .tree .key {
        color: var(--accent);
      }

      .tree .string {
        color: var(--bad);
      }

      :root[data-theme='dark'] .tree .string {
        color: #f9ab73;
      }

      .tree .tagged {
        color: var(--muted);
        font-style: italic;
      }

      .diff .added {
        display: block;
        background: var(--added);
      }

      .diff .removed {
        display: block;
        background: var(--removed);
        text-decoration: line-through;
        text-decoration-color: var(--faint);
      }

      .diff .same {
        display: block;
        color: var(--muted);
      }

      .diff-item {
        margin-bottom: 8px;
      }

      .diff-item header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 2px;
        color: var(--muted);
      }

      .frames {
        margin: 0;
        padding: 0;
        list-style: none;
        font: 11px/1.7 var(--mono);
      }

      .frames li {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 8px;
        border-bottom: 1px solid var(--line);
      }

      .frames .fn {
        min-width: 120px;
      }

      .frames button {
        min-height: 0;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        font: inherit;
        text-align: left;
        overflow-wrap: anywhere;
      }

      .thread svg {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .thread .life {
        stroke: var(--line);
        stroke-width: 1.5;
      }

      .thread .lane {
        fill: var(--ink);
        font:
          600 11px system-ui,
          sans-serif;
      }

      .thread .lane-sub,
      .thread .offset,
      .thread .note {
        fill: var(--muted);
        font: 10px var(--mono);
      }

      .thread .arrow {
        stroke: var(--muted);
        stroke-width: 1.2;
        fill: none;
      }

      .thread .arrow.beyond {
        stroke-dasharray: 4 3;
      }

      .thread .head {
        fill: var(--muted);
      }

      .thread .string {
        stroke: var(--ink);
        stroke-width: 1;
        fill: none;
        opacity: 0.35;
      }

      .thread .bead {
        fill: var(--paper);
        stroke: var(--ink);
        stroke-width: 1.5;
      }

      .thread .bead.answer {
        fill: var(--answered);
        stroke: var(--answered);
      }

      .thread .bead.failure {
        fill: var(--bad);
        stroke: var(--bad);
      }

      .thread .bead.credit {
        stroke-dasharray: 2 2;
      }

      .thread .kind {
        fill: var(--ink);
        font:
          600 10.5px system-ui,
          sans-serif;
      }

      .thread .words {
        fill: var(--muted);
        font: 10.5px var(--mono);
      }

      .progress {
        position: relative;
        height: 8px;
        margin: 8px 0 4px;
        border-radius: 4px;
        background: var(--line);
      }

      .progress i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        border-radius: 4px;
        background: var(--answered);
      }

      .progress u {
        position: absolute;
        top: -2px;
        bottom: -2px;
        width: 2px;
        background: var(--ink);
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        color: var(--muted);
      }

      .note {
        margin: 8px 0;
        color: var(--muted);
      }

      [data-view] > .note,
      .empty {
        margin: 12px;
      }

      .empty h2 {
        margin: 0 0 6px;
        font-size: 13px;
      }

      .empty ul {
        margin: 6px 0 10px;
        padding-left: 18px;
        color: var(--muted);
      }

      .sect {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }

      .sect h2 {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 0 0 6px;
        font-size: 12px;
      }

      .count {
        color: var(--muted);
        font-weight: 400;
      }

      table.plain td,
      table.plain th {
        position: static;
        border-bottom: 1px solid var(--line);
      }

      .scrub {
        position: sticky;
        top: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--raised);
      }

      .scrub input[type='range'] {
        flex: 1 1 200px;
        padding: 0;
        border: 0;
        background: none;
      }

      .scrub .when {
        font: 12px var(--mono);
      }

      .scrub .said {
        flex-basis: 100%;
        color: var(--muted);
      }

      .meter {
        display: inline-flex;
        gap: 2px;
        vertical-align: middle;
      }

      .meter i {
        width: 8px;
        height: 8px;
        border: 1px solid var(--answered);
        border-radius: 2px;
      }

      .meter i.on {
        background: var(--answered);
      }

      .bar-mini {
        position: relative;
        width: 140px;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
      }

      .bar-mini i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        border-radius: 3px;
        background: var(--answered);
      }

      #timeline svg {
        display: block;
        width: 100%;
        min-width: 560px;
        user-select: none;
      }

      #timeline .grid {
        stroke: var(--line);
      }

      #timeline .axis,
      #timeline .row-id {
        fill: var(--muted);
        font: 10px var(--mono);
      }

      #timeline .row-name {
        fill: var(--ink);
        font:
          11px system-ui,
          sans-serif;
      }

      #timeline .hit {
        fill: transparent;
      }

      #timeline .hit:hover {
        fill: var(--accent-soft);
      }

      #timeline .brush {
        fill: var(--accent-soft);
        stroke: var(--accent);
      }

      .tl-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
      }

      .spark {
        stroke: var(--answered);
        stroke-width: 1.3;
        fill: none;
      }

      .chip {
        padding: 0 6px;
        border-radius: 4px;
        background: var(--raised);
        box-shadow: 0 0 0 1px var(--line);
        font: 11px var(--mono);
        font-variant-numeric: tabular-nums;
      }

      .chip.failure {
        color: var(--bad);
        background: var(--bad-soft);
        box-shadow: none;
      }

      details.raw {
        margin: 6px 0;
      }

      summary {
        color: var(--muted);
        cursor: pointer;
      }

      details.raw pre {
        max-height: 50vh;
        margin-top: 4px;
        white-space: pre;
      }

      .exchange {
        padding: 4px 12px 8px;
        border-bottom: 1px solid var(--line);
      }

      .exchange .line {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
      }

      .exchange .envelopes {
        margin: 2px 0 0 12px;
        color: var(--muted);
        font: 11px/1.6 var(--mono);
      }

      .statusbar {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 16px;
        padding: 3px 8px;
        border-top: 1px solid var(--line);
        background: var(--raised);
        color: var(--muted);
      }

      .statusbar b {
        color: var(--ink);
        font-weight: 600;
      }

      #menu {
        position: fixed;
        z-index: 10;
        min-width: 180px;
        padding: 4px 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        box-shadow: 0 4px 16px rgb(0 0 0 / 0.2);
      }

      #menu button {
        display: block;
        width: 100%;
        min-height: 24px;
        padding: 2px 12px;
        border: 0;
        border-radius: 0;
        background: none;
        text-align: left;
      }

      #menu button:hover:not(:disabled),
      #menu button:focus-visible {
        background: var(--accent-soft);
      }

      #toast {
        position: fixed;
        right: 12px;
        bottom: 32px;
        padding: 4px 10px;
        border-radius: 4px;
        background: var(--ink);
        color: var(--paper);
      }

      @media (prefers-reduced-motion: no-preference) {
        .spin {
          transform-origin: 6px 6px;
          animation: spin 1s linear infinite;
        }

        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <button type="button" id="record" aria-pressed="true" title="Record, or pause (Ctrl+E)">
        ●
      </button>
      <button type="button" id="clear" title="Clear (Ctrl+L)" aria-label="Clear">⊘</button>
      <select id="source" aria-label="Client">
        <option value="all">All clients</option>
      </select>
      <input
        id="filter"
        type="search"
        spellcheck="false"
        aria-label="Filter"
        aria-describedby="filter-state"
        placeholder="Filter, as bead:debug reads one: d(rx), t(request), -token, e(request)"
      />
      <span id="filter-state" role="status"></span>
      <span class="group" role="group" aria-label="Quick filters">
        <button type="button" data-quick="t(request)" aria-pressed="false">Requests</button>
        <button type="button" data-quick="t(command)" aria-pressed="false">Commands</button>
        <button type="button" data-quick="t(notification)" aria-pressed="false">
          Notifications
        </button>
        <button type="button" data-quick="failed" aria-pressed="false">Failed</button>
      </span>
      <label><input type="checkbox" id="preserve" /> Preserve log</label>
      <span class="group">
        <button type="button" id="export" title="Export the records as JSON">Export</button>
        <button type="button" id="import" title="Import records from JSON">Import</button>
      </span>
      <input type="file" id="import-file" accept="application/json,.json" hidden />
      <span id="status" role="status">waiting for the page…</span>
    </header>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-tab="calls" aria-selected="true">Calls</button>
      <button type="button" role="tab" data-tab="state" aria-selected="false">State</button>
      <button type="button" role="tab" data-tab="timeline" aria-selected="false">Timeline</button>
      <button type="button" role="tab" data-tab="metrics" aria-selected="false">Metrics</button>
      <button type="button" role="tab" data-tab="wire" aria-selected="false">Wire</button>
    </nav>
    <main>
      <section data-view="calls" class="split" aria-label="Calls">
        <div id="list" class="rows" tabindex="0" aria-label="Calls, newest first">
          <div class="list-bar">
            <span class="group" role="group" aria-label="Show">
              <button type="button" data-mode="calls" aria-pressed="true">Calls</button>
              <button type="button" data-mode="envelopes" aria-pressed="false">Envelopes</button>
            </span>
            <span id="range"></span>
          </div>
          <table id="calls-table">
            <thead>
              <tr>
                <th scope="col"><span class="status"></span></th>
                <th scope="col">Call</th>
                <th scope="col">Procedure</th>
                <th scope="col" class="mid">Type</th>
                <th scope="col" class="mid">Started</th>
                <th scope="col" class="num">Duration</th>
                <th scope="col">Outcome</th>
                <th scope="col" class="wide">Waterfall</th>
              </tr>
            </thead>
            <tbody id="calls"></tbody>
          </table>
