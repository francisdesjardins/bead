[package]
name = "francisdesjardins-bead"
description = "Bead, a binary wire protocol: its core on the Rust side, the envelope's codec, the routers and their service layer, sessions and credentials, debugging and metrics, and the in-memory transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# every test target is named below: what tests/ holds beside them is theirs to share
autotests = false

[lib]
name = "bead"

[features]
# the test kit, bead::testing, which the tests alone reach: no API (decision 0044)
testing = ["serde/derive"]

[dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ryu-js = { workspace = true }
p256 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
# the crate itself, with its test kit: one copy of bead for the unit tests and the players
bead = { package = "francisdesjardins-bead", path = ".", features = ["testing"] }
bead-interop = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
libtest-mimic = { workspace = true }

# the conformance players, a trial per entry, named by the entry's own name
[[test]]
name = "vectors"
harness = false

[[test]]
name = "conversations"
harness = false

[[test]]
name = "clocks"
harness = false

[[test]]
name = "durations"
harness = false

[[test]]
name = "identities"
harness = false

[[test]]
name = "codecs"
harness = false

[[test]]
name = "debug_filters"
harness = false

[[test]]
name = "metrics"
harness = false

[[test]]
name = "validations"
harness = false

[lints]
workspace = true
