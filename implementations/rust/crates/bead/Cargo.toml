[package]
name = "francisdesjardins-bead"
description = "Bead, a binary wire protocol: its core on the Rust side, the envelope's codec, the routers and their service layer, sessions and credentials, debugging and metrics, and the in-memory transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# every test target is named below: what tests/ holds beside them is theirs to share
autotests = false

[lib]
name = "bead"

[features]
# the test kit, bead::testing, which the tests alone reach: no API (decision 0044)
testing = ["serde/derive", "dep:sha1"]
# the WebSocket transport, server and client, over tokio's sockets (decision 0049)
websocket = [
  "tokio/net",
  "tokio/io-util",
  "dep:socket2",
  "dep:http",
  "dep:tungstenite",
  "dep:tokio-tungstenite",
  "dep:futures-util",
  "dep:rustls",
  "dep:tokio-rustls",
  "dep:rustls-platform-verifier",
  "dep:httpdate",
]
# the HTTP transport's server over tokio's sockets, on hyper's HTTP/1.1 (decision 0049)
http = [
  "tokio/net",
  "tokio/io-util",
  "dep:socket2",
  "dep:http",
  "dep:hyper",
  "dep:hyper-util",
  "dep:httpdate",
]

[dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ryu-js = { workspace = true }
p256 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
# a request's head, read by the judgement under its bounds (decision 0049)
httparse = { workspace = true }
# a host as the URL Standard reads it, which the judgement of a transport's security reads by
idna = { workspace = true }
# the test kit's alone: the order of the seeds its mutations draw from, by their SHA-1
sha1 = { workspace = true, optional = true }
# both socket transports': a listener's socket, the request and response types, and the date both
# servers write
socket2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
# the WebSocket transport's alone
tungstenite = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
# the HTTP transport's alone
hyper = { workspace = true, optional = true, features = ["server", "http1"] }
hyper-util = { workspace = true, optional = true, features = ["tokio"] }

[dev-dependencies]
# the crate itself, with its test kit: one copy of bead for the unit tests and the players
bead = { package = "francisdesjardins-bead", path = ".", features = ["testing", "websocket", "http"] }
bead-interop = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
libtest-mimic = { workspace = true }

# the conformance players, a trial per entry, named by the entry's own name
[[test]]
name = "vectors"
harness = false

[[test]]
name = "conversations"
harness = false

[[test]]
name = "clocks"
harness = false

[[test]]
name = "durations"
harness = false

[[test]]
name = "identities"
harness = false

[[test]]
name = "codecs"
harness = false

[[test]]
name = "debug_filters"
harness = false

[[test]]
name = "metrics"
harness = false

[[test]]
name = "validations"
harness = false

[[test]]
name = "transports"
harness = false

# seeded mutations of the conformance files' bytes, fed to the envelope readers and the parcel's
[[test]]
name = "envelope_fuzz"

[[test]]
name = "broker_parcel_fuzz"

[lints]
workspace = true
