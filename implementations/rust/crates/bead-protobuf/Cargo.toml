[package]
name = "francisdesjardins-bead-protobuf"
description = "Bead's proto payload codec on the Rust side, over Buffa: a payload's records checked against its message, its depth bound, the walk of its required fields, a typed codec over generated code and a dynamic one by descriptor, and the validators' runtime generated rules judge by."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# every test target is named below
autotests = false

[lib]
name = "bead_protobuf"

[features]
# protobuf's JSON by Bead's own mapping, a message's form a gateway binds and writes by and a caller
# reads and writes by (decision 0052)
transcoding = ["bead/transcoding", "dep:ryu-js"]
# the test kit, bead_protobuf::testing: the tests' messages, generated by the build script from
# proto/tests.binpb, which the tests alone reach: no API (decision 0044)
testing = ["dep:bead-protobuf-build", "dep:buffa-types"]

[dependencies]
bead = { workspace = true }
bytes = { workspace = true }
buffa = { workspace = true }
buffa-descriptor = { workspace = true }
buffa-types = { workspace = true, optional = true }
# a violation's bounds and its value, the core's JSON
serde_json = { workspace = true }
# the transcoding's: a double and a float written as ECMAScript writes them, as every side writes
# them (spec/transcoding.md 5.6.1)
ryu-js = { workspace = true, optional = true }

[build-dependencies]
bead-protobuf-build = { workspace = true, optional = true }

[dev-dependencies]
# the crate itself, with its test kit: one copy of bead_protobuf for the unit tests and the players
bead-protobuf = { workspace = true, features = ["testing", "transcoding"] }
bead = { workspace = true, features = ["testing", "transcoding", "gateway"] }
# beadc's table of spec/transcoding.proto's Transcoding service and its resolvers, which the
# exchanges of spec/transcoding.json call through a gateway (decision 0052)
bead-interop = { workspace = true, features = ["transcoding"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
libtest-mimic = { workspace = true }
# a document's entity tag, as the exchanges expect it
sha2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }

# spec/codecs.json's proto entries, a trial each, named by the entry's own name
[[test]]
name = "codecs"
harness = false

[[test]]
name = "service"

# spec/transcoding.json, a trial each entry, named `<group>: <name>`: its readings, writings and
# bindings through JsonForm, its templates, failures and events through the core's, and its
# exchanges through a gateway on its own listener over beadc's table
[[test]]
name = "transcoding"
harness = false
required-features = ["transcoding"]

# spec/validations.json's verdicts, a trial each, named by the verdict's own name, judged by the
# validators beadc generates for spec/validations.proto into tests/generated
[[test]]
name = "validations"
harness = false

[lints]
workspace = true
