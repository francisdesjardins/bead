[package]
name = "francisdesjardins-bead-protobuf"
description = "Bead's proto payload codec on the Rust side, over Buffa: a payload's records checked against its message, its depth bound, the walk of its required fields, a typed codec over generated code and a dynamic one by descriptor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# every test target is named below
autotests = false

[lib]
name = "bead_protobuf"

[features]
# the test kit, bead_protobuf::testing: the tests' messages, generated by the build script from
# proto/tests.binpb, which the tests alone reach: no API (decision 0044)
testing = ["dep:bead-protobuf-build", "dep:buffa-types"]

[dependencies]
bead = { workspace = true }
bytes = { workspace = true }
buffa = { workspace = true }
buffa-descriptor = { workspace = true }
buffa-types = { workspace = true, optional = true }

[build-dependencies]
bead-protobuf-build = { workspace = true, optional = true }

[dev-dependencies]
# the crate itself, with its test kit: one copy of bead_protobuf for the unit tests and the players
bead-protobuf = { workspace = true, features = ["testing"] }
bead = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
libtest-mimic = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# spec/codecs.json's proto entries, a trial each, named by the entry's own name
[[test]]
name = "codecs"
harness = false

[[test]]
name = "service"

[lints]
workspace = true
