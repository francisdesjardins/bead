# What the Rust side's dependencies are held to (decision 0044), by cargo-deny, in its workspace and
# in the two projects outside it, the fuzz targets and the conformance player: RustSec's advisories,
# a yanked crate refused; the licences allowed, each one a crate of the graph holds, an expression's
# branch taken as it reads; crates.io alone as a source; and one version of each crate, a duplicate
# a listed exception with its reason.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Zlib, a permissive licence the OSI approves: foldhash's, which Buffa's runtime takes through
# hashbrown; ISC, rustls-webpki's, aws-lc-rs's and aws-lc-sys's, a permissive licence the OSI
# approves
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "Unicode-3.0", "BSL-1.0", "Zlib", "ISC"]
confidence-threshold = 0.93

# the platform verifier's roots on wasm32 alone, where no socket transport builds
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# libFuzzer's runtime, LLVM's, in the fuzz targets alone, outside the workspace and distributed
# nowhere: (MIT OR Apache-2.0) AND NCSA, NCSA a permissive licence the OSI approves
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

# the workspace's own crates, published nowhere, hold its licence
[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
# a member's path to another member names no version, which no registry reads
allow-wildcard-paths = true
skip = [
    # syn 2 beside bead-house's syn 3: buffa-codegen and prettyplease bring it, at build time,
    # through bead-protobuf-build, the generator of the proto payload's messages; and jni-macros and
    # jni-sys-macros, the platform verifier's on Android alone; no runtime holds it
    { crate = "syn@2", reason = "Buffa's generator and the platform verifier's jni macros, Android's, bring it at build time, beside bead-house's syn 3" },
    # hashbrown 0.15 beside h2's, through indexmap: Buffa's runtime takes 0.15
    { crate = "hashbrown@0.15", reason = "Buffa's runtime alone takes 0.15, beside h2's indexmap 0.17" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
