# beadc.yaml: hello's services, from its .proto, generated in each language, each language's
# messages generated by beadc or by the project's own build. ./beadc.sh generate (or ./beadc.ps1
# generate) writes them, and generate --check holds them there.
version: 1
source:
  proto: [proto]
blueprint: gen/hello.blueprint.json
outputs:
  - language: typescript
    out: typescript/gen/generate
    importExtension: ts
  - language: typescript
    out: typescript/gen/external
    importExtension: ts
    messages: external
    messagesOut: typescript/gen/messages
  - language: csharp
    out: dotnet/gen/generate
  - language: csharp
    out: dotnet/gen/external
    messages: external
