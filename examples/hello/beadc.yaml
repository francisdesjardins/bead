# beadc.yaml: hello's services, from its .proto, generated in each language, each language's
# messages generated by beadc or by the project's own build. ./beadc.sh generate (or ./beadc.ps1
# generate) writes them, and generate --check holds them there.
version: 1
source:
  proto: [proto]
blueprint: gen/hello.blueprint.json
outputs:
  - language: typescript
    out: typescript/gen/generate
    importExtension: ts
    http: true
  - language: typescript
    out: typescript/gen/external
    importExtension: ts
    messages: external
    messagesOut: typescript/gen/messages
    http: true
  - language: csharp
    out: dotnet/gen/generate
    http: true
  - language: csharp
    out: dotnet/gen/external
    messages: external
    http: true
# the OpenAPI document of hello's routes, which an output with http: true embeds and its
# gateway serves
openapi:
  out: gen/openapi.json
# the output folders are beadc's own: generate takes out what it no longer writes there
clean: true
