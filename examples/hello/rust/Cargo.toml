# HelloService's Rust server and client, generated by beadc from ../proto: a project of its own,
# outside the Rust side's workspace, its own lock, its runtimes reached by path. Its two binaries are
# its two message modes, each over one target folder: `hello`, from src/main.rs, mounts
# src/generated/generate, whose messages beadc wrote with protoc-gen-buffa; `hello-external`, from
# src/external.rs, with the feature `external`, mounts src/generated/external, whose messages the
# build script writes through bead_protobuf_build::config_of, over the set buf builds from ../.
[package]
name = "hello"
description = "HelloService's Rust server and client, generated by beadc from its .proto, where only the resolvers, the hook and the calls are written."
edition = "2024"
# the floor is the pin, rust-toolchain.toml's, the Rust side's own
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/francisdesjardins/bead"
readme = "../README.md"
keywords = ["bead", "rpc", "example"]
categories = ["network-programming"]
publish = false

# each binary is named below
autobins = false

[[bin]]
name = "hello"
path = "src/main.rs"

[[bin]]
name = "hello-external"
path = "src/external.rs"
required-features = ["external"]

[features]
# the messages of hello-external, written by the build script from the set buf builds
external = ["dep:bead-protobuf-build"]

[dependencies]
# the core and its WebSocket transport, the server's and the client's
bead = { package = "francisdesjardins-bead", path = "../../../implementations/rust/crates/bead", features = ["websocket"] }
# the proto codec the generated descriptors name, and the validators' runtime their rules call
bead-protobuf = { package = "francisdesjardins-bead-protobuf", path = "../../../implementations/rust/crates/bead-protobuf" }
# Buffa's runtime and descriptors, which the generated messages name: the one Buffa the generated
# code is for, as bead-protobuf requires it
buffa = { version = "=0.9.2", default-features = false, features = ["std"] }
buffa-descriptor = { version = "=0.9.2", default-features = false, features = ["std", "reflect"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }

[build-dependencies]
# Bead's setting of Buffa's generator, which the build script runs for hello-external
bead-protobuf-build = { package = "francisdesjardins-bead-protobuf-build", path = "../../../implementations/rust/crates/bead-protobuf-build", optional = true }

# ── Lints ─────────────────────────────────────────────────────────────────────
# The Rust side's, implementations/rust/Cargo.toml's [workspace.lints] copied whole, as the other
# halves take their side's rules by reference: Cargo reads no table outside its own workspace.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
non_ascii_idents = "forbid"
let_underscore_drop = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unexpected_cfgs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
unescaped_backticks = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# nursery lints allowed, each with its reason
# rustc's unreachable_pub asks pub(crate) of an item a private module offers the crate; this one
# asks pub of the same item, so no visibility passes both: rustc's form is kept
redundant_pub_crate = { level = "allow", priority = 1 }
# a public const fn is a promise only a major release takes back; const is written where the code
# needs one, never because it could be
missing_const_for_fn = { level = "allow", priority = 1 }
# restriction lints, chosen one by one
# a library never ends its caller: every refusal is an Err
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
# a parser of a peer's bytes indexes, slices and counts by checked operations only
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
# a library writes nothing of its own; the trace is its voice
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# defence in depth beside forbid(unsafe_code)
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
# an exception is #[expect(lint, reason = "…")], which fails once it stops matching
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# an Arc cloned as Arc::clone, no lock where an atomic or the owner serves
clone_on_ref_ptr = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
# a test's assertion says what it holds
missing_assert_message = "deny"
assertions_on_result_states = "deny"
# a new variant of a wire enum breaks every match that must decide it
wildcard_enum_match_arm = "deny"
rest_pat_in_fully_bound_structs = "deny"
unneeded_field_pattern = "deny"
# an error is named, kept or said dropped
try_err = "deny"
map_err_ignore = "deny"
error_impl_error = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
# one surface, read alike
impl_trait_in_params = "deny"
partial_pub_fields = "deny"
same_name_method = "deny"
multiple_inherent_impl = "deny"
# edition 2018's form, envelope.rs beside envelope/, never mod.rs
mod_module_files = "deny"
# one form each
str_to_string = "deny"
format_push_string = "deny"
verbose_file_reads = "deny"
needless_raw_strings = "deny"
redundant_type_annotations = "deny"
unseparated_literal_suffix = "deny"
empty_structs_with_brackets = "deny"
if_then_some_else_none = "deny"
deref_by_slicing = "deny"
infinite_loop = "deny"
mixed_read_write_in_expression = "deny"
suspicious_xor_used_as_pow = "deny"
string_lit_chars_any = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
fn_to_numeric_cast_any = "deny"
filetype_is_file = "deny"
large_include_file = "deny"
create_dir = "deny"
# The example's own, beside the copy: cargo-deny holds the graph to one version of each crate, its
# exceptions deny.toml's; clippy's lint reads cargo's metadata, which counts crates no build of
# this project compiles, ring's getrandom 0.2 among them
multiple_crate_versions = { level = "allow", priority = 1 }
