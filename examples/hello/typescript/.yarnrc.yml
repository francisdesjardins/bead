# no dependency runs a script as it installs, but those package.json lets by dependenciesMeta
enableScripts: false

# no version younger than three days, a release compromised in its first days being caught in
# them: the shortest of the cooldowns .github/dependabot.yml gives, which holds the longer ones
npmMinimalAgeGate: 3d

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.1.cjs
