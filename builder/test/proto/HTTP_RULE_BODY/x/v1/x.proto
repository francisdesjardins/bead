syntax = "proto3";

package x.v1;

import "bead/options.proto";
import "google/api/annotations.proto";

option (bead.file) = {
  admission: {
    none: {}
  }
};

// A request.
message Request {
  string name = 1;
}

// A result.
message Response {
  string name = 1;
}

// Bodies that name no field, a field a variable binds, or come on a delete.
service XService {
  option (bead.service) = {
    id: 1
    revision: 1
  };
  // Writes.
  rpc Put(Request) returns (Response) {
    option (bead.procedure) = {id: 1};
    option (google.api.http) = {
      post: "/v1/a"
      body: "missing"
      additional_bindings {
        post: "/v1/b/{name}"
        body: "name"
      }
      additional_bindings {
        delete: "/v1/c"
        body: "*"
      }
    };
  }
}
