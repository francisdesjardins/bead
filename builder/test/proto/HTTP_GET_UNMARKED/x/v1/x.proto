syntax = "proto3";

package x.v1;

import "bead/options.proto";
import "google/api/annotations.proto";

option (bead.file) = {
  admission: {
    none: {}
  }
};

// A request.
message Request {
  string name = 1;
}

// A result.
message Response {
  string name = 1;
}

// A get rule on a method not marked NO_SIDE_EFFECTS.
service XService {
  option (bead.service) = {
    id: 1
    revision: 1
  };
  // Reads.
  rpc Get(Request) returns (Response) {
    option (bead.procedure) = {id: 1};
    option (google.api.http) = {
      get: "/v1/{name}"
    };
  }
}
