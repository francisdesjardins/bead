syntax = "proto3";

package x.v1;

import "bead/options.proto";
import "google/api/annotations.proto";

option (bead.file) = {
  admission: {
    none: {}
  }
};

// A request.
message Request {
  string name = 1;
}

// A result.
message Response {
  string name = 1;
}

// A rule on a command.
service XService {
  option (bead.service) = {
    id: 1
    revision: 1
  };
  // Asks its caller.
  rpc Ask(Request) returns (Response) {
    option (bead.procedure) = {id: 1, command: {}};
    option (google.api.http) = {
      post: "/v1/ask"
      body: "*"
    };
  }
}
