syntax = "proto3";

package x.v1;

import "bead/options.proto";
import "google/api/annotations.proto";

option (bead.file) = {
  admission: {
    none: {}
  }
};

// A request.
message Request {
  string name = 1;
}

// Routed.
service XService {
  option (bead.service) = {
    id: 1
    revision: 2
  };

  // Put.
  rpc Put(Request) returns (Request) {
    option (bead.procedure) = {id: 1};
    option (google.api.http) = {post: "/api/**", body: "*"};
  }

  // Added.
  rpc Added(Request) returns (Request) {
    option (bead.procedure) = {id: 2};
  }
}
