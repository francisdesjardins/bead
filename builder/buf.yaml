# buf's own workspace over the builder's .proto files that compile: `yarn check` runs `buf lint` and
# `buf format --diff --exit-code` over it. beadc never reads this file: it passes buf a configuration
# of its own. A rule's fixture under test/proto/ is its own root, outside the workspace, since some
# compile on purpose to nothing and one holds a copy of bead/options.proto, and so is each current of
# beadc breaking's .proto cases, which their earlier, a module here, holds to STANDARD. The messages
# fixture, whose bindings name messages of its own, is a module apart from test/fixtures, whose tests
# read that root whole.
version: v2
modules:
  - path: proto
    lint:
      use: [STANDARD]
      # bead/options.proto's package is `bead`, as protobuf's own options name none
      except: [PACKAGE_VERSION_SUFFIX]
      # protovalidate's validate.proto, vendored at v1.2.2 as Buf publishes it, is Buf's to lint
      ignore: [proto/buf/validate/validate.proto]
  - path: test/fixtures
    lint:
      use: [STANDARD]
      # bead.Raw, bead.Text and bead.Json serve many rpcs, as request and as response
      except: [RPC_REQUEST_STANDARD_NAME, RPC_RESPONSE_STANDARD_NAME, RPC_REQUEST_RESPONSE_UNIQUE]
  - path: test/messages
    lint:
      use: [STANDARD]
      # as test/fixtures: bead.Raw, bead.Text and bead.Json serve many rpcs
      except: [RPC_REQUEST_STANDARD_NAME, RPC_RESPONSE_STANDARD_NAME, RPC_REQUEST_RESPONSE_UNIQUE]
  # the earlier of beadc breaking's .proto cases, each current one edit of it
  - path: test/breaking/proto/earlier/proto
    lint:
      use: [STANDARD]
