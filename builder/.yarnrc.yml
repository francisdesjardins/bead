# The release is vendored rather than resolved from the machine, as the TypeScript side's is: Node 26
# unbundled Corepack, so `yarn` on PATH is a 1.22 that refuses a project declaring yarn@4. `yarnPath`
# makes every `yarn` in this project run the file below, whatever is installed globally.
nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.1.cjs
