# The code protoc-gen-es writes for bead/options.proto, buf/validate/validate.proto and
# google/api/annotations.proto with the http.proto it imports, which the front end reads a .proto's
# options through, Bead's, protovalidate's and google.api.http: run by buf, both from npm. `yarn options:generate` writes it; `yarn check` writes it again
# apart and fails on a difference. The plugin runs under the Node that runs buf, so no PATH is read.
version: v2
inputs:
  - directory: proto
plugins:
  - local: [node, node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es]
    out: src/generated
    opt: [target=ts, import_extension=ts, erasable_syntax=true]
