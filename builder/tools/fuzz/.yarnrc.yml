# A project of its own, apart from beadc above it, as its own lockfile says: Jazzer.js is a native
# dependency, installed by hand, which neither beadc's `yarn install --immutable` nor CI fetches.
# Its addon comes prebuilt, so no dependency runs a script as it installs.
enableScripts: false

nodeLinker: node-modules

yarnPath: ../../.yarn/releases/yarn-4.18.1.cjs
