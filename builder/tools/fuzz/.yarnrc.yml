# A project of its own, apart from beadc above it, as its own lockfile says: Jazzer.js is a native
# dependency, installed apart, which neither beadc's `yarn install --immutable` nor a pull
# request's CI fetches; the weekly campaign installs it. Its addon comes prebuilt, so no
# dependency runs a script as it installs.
enableScripts: false

# no version younger than three days, a release compromised in its first days being caught in
# them: the shortest of the cooldowns .github/dependabot.yml gives, which holds the longer ones
npmMinimalAgeGate: 3d

nodeLinker: node-modules

yarnPath: ../../.yarn/releases/yarn-4.18.1.cjs
