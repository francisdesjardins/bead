name: Image

# beadc's image on GitHub's container registry, at each release (decision 0055): built on the
# release's tag alone, from the tag's own commit, builder/Dockerfile built on each platform natively
# and its test stage passed there, both images joined in one index under beadc's version,
# `ghcr.io/francisdesjardins/beadc:<version>`, its provenance attested by GitHub and its index signed
# keylessly by cosign, then verified by the README's block. No `latest`: a team pins a version, by
# its digest. Never a gate: CI judged the release's commit before its tag.
on:
  # ! GitHub creates no push event for tags when more than three are pushed at once, as a release's
  # one push can be: the release reads this run, and dispatches it on the tag when none started
  push:
    tags: ['v*']
  # on a release's tag alone, whose image is not on the registry yet: `gh workflow run image.yml
  # --ref vX.Y.Z`. The provenance and the signature name the ref and the commit the run is on
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/francisdesjardins/beadc
  # CI's Node, by its line
  NODE_VERSION: '26'

jobs:
  # The tag, the version and the commit, each read once: the version is beadc's own, from
  # builder/package.json at the tag, which the tag names too (decision 0008).
  release:
    name: The release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      # ! the ref reaches the shell through the environment alone, never inside the script
      - name: The release's tag, the ref the run is on
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/tags/$TAG" ] || ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=image::run image.yml on a release's tag, vX.Y.Z, not $REF"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # every branch and every tag, for the tag's commit and main's
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # ! the tag names the run's own commit, and that commit is on main: a tag moved since the run
      # started, or one set off main by mistake, publishes nothing. A writer could remove this
      # check, so a verifier holds the ancestry itself, as the README's block does
      - name: The tag's commit, on main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tagged="$(git rev-parse "refs/tags/$TAG^{commit}")"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error title=image::$TAG names $tagged, not the run's commit $GITHUB_SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error title=image::$TAG's commit $GITHUB_SHA is not on main"
            exit 1
          fi
      - name: beadc's version, the image's tag
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(jq -r .version builder/package.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error title=image::builder/package.json at $TAG states $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      # ! buildx and BuildKit by their versions, BuildKit by its digest too: a release moves them
      # with the base's digest (README, the release). The registry's words below are buildx's
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ! a version's image is pushed once: a team pins its digest, which a second build would not
      # give again. Only the registry's "not found" lets the run on; any other failure stops it
      - name: No image at this version yet
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if out="$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1)"; then
            echo "::error title=image::$IMAGE:$VERSION is on the registry already"
            exit 1
          elif ! grep -q ': not found' <<<"$out"; then
            echo "::error title=image::the registry did not say whether $IMAGE:$VERSION is there: $out"
            exit 1
          fi

  # Each platform on its own runner, as CI's image legs build it: the test stage first, beadc's
  # tests on the image itself, then the image, pushed by its digest alone.
  build:
    name: The image (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            name: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            name: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: The tag's commit, checked out
        env:
          REVISION: ${{ needs.release.outputs.revision }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$REVISION" ]; then
            echo "::error title=image::the checkout is $(git rev-parse HEAD), not the tag's $REVISION"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ! `context: .`, the checkout asserted above: the action's default, a git context, fetches
      # the ref again
      - name: The test stage, on this platform's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: builder/Dockerfile
          platforms: ${{ matrix.platform }}
          target: test
          push: false
      # GitHub's attestation is the image's provenance: no attestation manifest of Buildx's beside
      # each platform's
      - name: The image, pushed by its digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: builder/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release.outputs.revision }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: The digest, for the index
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # a week for `gh run rerun --failed`, which runs the index's job again from these
          retention-days: 7

  # The index of both platforms under beadc's version, then its provenance and its signature, each
  # on the digest the index was pushed under, which a team pins; then the README's verify block
  # against it.
  publish:
    name: The index, attested and signed
    needs: [release, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: The tag's commit, checked out
        env:
          REVISION: ${{ needs.release.outputs.revision }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$REVISION" ]; then
            echo "::error title=image::the checkout is $(git rev-parse HEAD), not the tag's $REVISION"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.0
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ! the registry is asked again right before the push. The one index it may hold is this
      # run's own, of exactly the two digests built here at the tag's commit, pushed before a
      # failure that `gh run rerun --failed` runs this job again for
      - name: The index, tagged with beadc's version
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.release.outputs.version }}
          REVISION: ${{ needs.release.outputs.revision }}
        run: |
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error title=image::${#sources[@]} platforms' digests, not 2"
            exit 1
          fi
          if out="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' 2>&1)"; then
            held="$(jq -r '.manifests[].digest' <<<"$out" | sort)"
            built="$(printf '%s\n' "${sources[@]#"$IMAGE@"}" | sort)"
            if [ "$held" != "$built" ] ||
              ! jq -e --arg revision "$REVISION" '.annotations["org.opencontainers.image.revision"] == $revision' <<<"$out" > /dev/null; then
              echo "::error title=image::$IMAGE:$VERSION is on the registry already"
              exit 1
            fi
            digest="$(jq -re .digest <<<"$out")"
            echo "$IMAGE:$VERSION is this run's own index, pushed before"
          elif ! grep -q ': not found' <<<"$out"; then
            echo "::error title=image::the registry did not say whether $IMAGE:$VERSION is there: $out"
            exit 1
          else
            docker buildx imagetools create --metadata-file "$RUNNER_TEMP/index.json" \
              --annotation "index:org.opencontainers.image.source=https://github.com/francisdesjardins/bead" \
              --annotation "index:org.opencontainers.image.version=$VERSION" \
              --annotation "index:org.opencontainers.image.revision=$REVISION" \
              --tag "$IMAGE:$VERSION" "${sources[@]}"
            # the digest pushed, as buildx wrote it, never read back by the tag
            digest="$(jq -re '."containerimage.descriptor".digest' "$RUNNER_TEMP/index.json")"
          fi
          resolved="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          if [ "$resolved" != "$digest" ]; then
            echo "::error title=image::$IMAGE:$VERSION resolves to $resolved, not the index's $digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # ! no storage record: GitHub keeps one for an organization's repository alone
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # keyless: the certificate Fulcio gives names this workflow at the tag and its commit, and
      # Rekor logs it
      - name: The signature, keyless
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: The digest
        env:
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          echo "$IMAGE:$VERSION is $IMAGE@$DIGEST"
          {
            echo "### beadc $VERSION"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # the README's general block, in POSIX shell and in PowerShell, as a reader runs it, against
      # the index just signed: a check a reader's run would fail fails the release's run first
      - name: The README's verify block, against the index
        env:
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ steps.index.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/verify-image.mjs --from builder/README.md --version "$VERSION" --digest "$DIGEST"
