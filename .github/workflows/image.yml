name: Image

# beadc's image on GitHub's container registry, at each release (decision 0055): the release's tag
# checked out, builder/Dockerfile built on each platform natively and its test stage passed there,
# both images joined in one index under beadc's version, `ghcr.io/francisdesjardins/beadc:<version>`,
# its provenance attested by GitHub and its index signed keylessly by cosign. No `latest`: a team
# pins a version, by its digest. Never a gate: CI judged the release's commit before its tag.
on:
  # ! GitHub creates no push event for tags when more than three are pushed at once, as a release's
  # one push can be: the release reads this run, and dispatches it when none started
  push:
    tags: ['v*']
  # a release's tag, from develop or main, whose image is not on the registry yet
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, vX.Y.Z, whose image to publish
        required: true
        type: string

concurrency:
  group: image-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/francisdesjardins/beadc

jobs:
  # The tag, the version and the commit, each read once: the version is beadc's own, from
  # builder/package.json at the tag, which the tag names too (decision 0008).
  release:
    name: The release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      # ! the input reaches the shell through the environment alone, never inside the script
      - name: The tag, and the branch a dispatch runs from
        id: tag
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=image::$TAG is no release's tag, vX.Y.Z"
            exit 1
          fi
          # the signature's identity names the ref the workflow ran from: a tag, develop or main
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/develop ] && [ "$REF" != refs/heads/main ]; then
            echo "::error title=image::dispatch image.yml from develop or main, not $REF"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - name: beadc's version, the image's tag
        id: version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(jq -r .version builder/package.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error title=image::builder/package.json at $TAG states $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ! a version's image is pushed once: a team pins its digest, which a second build would not
      # give again. A run that failed after its index was pushed is run again by its failed job
      - name: No image at this version yet
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error title=image::$IMAGE:$VERSION is on the registry already"
            exit 1
          fi

  # Each platform on its own runner, as CI's image legs build it: the test stage first, beadc's
  # tests on the image itself, then the image, pushed by its digest alone.
  build:
    name: The image (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            name: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            name: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ! `context: .`, the tag's checkout: the action's default, a git context, builds the commit
      # the run started from, which a dispatch takes from its branch
      - name: The test stage, on this platform's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: builder/Dockerfile
          platforms: ${{ matrix.platform }}
          target: test
          push: false
      # GitHub's attestation is the image's provenance: no attestation manifest of Buildx's beside
      # each platform's
      - name: The image, pushed by its digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: builder/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release.outputs.revision }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: The digest, for the index
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # a week for `gh run rerun --failed`, which runs the index's job again from these
          retention-days: 7

  # The index of both platforms under beadc's version, then its provenance and its signature, each
  # on the index's digest, which a team pins.
  publish:
    name: The index, attested and signed
    needs: [release, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The index, tagged with beadc's version
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.release.outputs.version }}
          REVISION: ${{ needs.release.outputs.revision }}
        run: |
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error title=image::${#sources[@]} platforms' digests, not 2"
            exit 1
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/francisdesjardins/bead" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --tag "$IMAGE:$VERSION" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # ! no storage record: GitHub keeps one for an organization's repository alone
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # keyless: the certificate Fulcio gives names this workflow at its ref, and Rekor logs it
      - name: The signature, keyless
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: The digest
        env:
          VERSION: ${{ needs.release.outputs.version }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          echo "$IMAGE:$VERSION is $IMAGE@$DIGEST"
          {
            echo "### beadc $VERSION"
            echo
            echo "\`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
