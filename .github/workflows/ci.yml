name: CI

# The jobs a change reaches, by the rules of tools/ci-scope.mjs: on a feature branch and a pull
# request into develop, the jobs of the areas its changed paths reach, a path no rule names reaching
# every job; on develop, main, a release or a hotfix branch and by hand, every job. `ci-ok` stands
# for every job; it fails when a job in scope did not pass, or one out of scope ran.
on:
  # Branches only: a tag pushed by a release points at a commit its branch's run already checked.
  # Dependabot's branches run once, as their pull requests: a push run would check the same tree.
  push:
    branches: ['**', '!dependabot/**']
  pull_request:
  # The suite against an unchanged tree, which is how a flake is told from a failure.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A CI pins: the runner's image by its release, never `ubuntu-latest`, and Node by its line. Node
  # is the current line; `engines.node` in the TypeScript side's manifest declares a floor, and the
  # TypeScript job runs on it too.
  NODE_VERSION: '26'
  # The vendored release, invoked as a file: no Corepack, and the runner's own Yarn 1.22 refuses a
  # project declaring `packageManager: yarn@4.18.1`.
  YARN: node .yarn/releases/yarn-4.18.1.cjs
  # The TypeScript suite is unit tests without a browser: nothing to download.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  # ! the shards the TypeScript side's tests run in: the `typescript` job's matrix lists one entry a
  # shard, and typescript-coverage waits for the coverage of each
  TYPESCRIPT_SHARDS: 2

jobs:
  # ── Scope ────────────────────────────────────────────────────────────────────
  # The areas the change reaches, each a job's id, as tools/ci-scope.mjs maps each changed path: a
  # JSON array every job but `commits` reads in its `if:`. On a feature branch, what changed since
  # its merge base with develop; on a pull request into develop, since its base; every area on
  # develop, main, a release or a hotfix branch, by hand, or where the merge base cannot be read.
  # `fetch-depth: 0` brings develop's history, where the merge base is.
  scope:
    name: Scope
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      areas: ${{ steps.areas.outputs.areas }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: areas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/ci-scope.mjs --github

  # ── Spec ─────────────────────────────────────────────────────────────────────
  # The conformance files are what their generators write: regenerated, they must come out
  # identical to the committed ones, byte for byte. Then spec/check.py, from its hash-locked
  # dependencies: each file under its schema, the version of its document, the spec's sections and
  # the vector groups naming each other, the companion's expositions read as 0.0.4, each side's
  # tests reading every group, and each count the tables of files of docs/support.md and the README
  # state.
  spec:
    name: Spec
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'spec')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.9'
      # ! before the generators: make_validations.py matches its patterns by google-re2
      - run: >-
          python -m pip install --disable-pip-version-check -q --require-hashes --only-binary=:all:
          -r spec/requirements.txt
      # The UCD's files make_validations.py reads, kept between runs: it checks each one's sha256 as it
      # reads it, and fetches only what the cache lacks.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/bead-ucd
          key: ucd-${{ hashFiles('spec/generators/ucd.json') }}
      - run: python spec/generators/make_vectors.py
      - run: python spec/generators/make_conversations.py
      - run: python spec/generators/make_transports.py
      - run: python spec/generators/make_clocks.py
      - run: python spec/generators/make_durations.py
      - run: python spec/generators/make_debug_filters.py
      - run: python spec/generators/make_metrics.py
      - run: python spec/generators/make_codecs.py
      - run: python spec/generators/make_identities.py
      - run: python spec/generators/make_validations.py
      - run: python spec/generators/make_transcoding.py
      - run: git diff --exit-code -- spec
      - name: No file the generators wrote is new
        run: test -z "$(git status --porcelain -- spec)"
      - run: python spec/check.py

  # ── Playwright ───────────────────────────────────────────────────────────────
  # The version of `@playwright/test` the TypeScript side pins, which names Microsoft's image of it:
  # the jobs that run a browser run in that image, Chromium and what it needs already there, so no
  # job installs a browser, and no copy of the version stands anywhere else.
  playwright:
    name: Playwright's version
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'playwright')
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
      site: ${{ steps.version.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            implementations/typescript/package.json
            site/package.json
          sparse-checkout-cone-mode: false
      # ! an exact version alone names an image: a range names none
      - id: version
        run: >-
          node -e "const exact = (v, name) => { if (!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(v)) { throw new Error(name + ' is ' + v + ', no exact version'); } return v; };
          console.log('version=' + exact(require('./implementations/typescript/package.json').devDependencies['@playwright/test'], '@playwright/test'));
          console.log('site=' + exact(require('./site/package.json').devDependencies['playwright-core'], 'playwright-core'))" >> "$GITHUB_OUTPUT"

  # ── TypeScript ───────────────────────────────────────────────────────────────
  # The TypeScript side's gate, in three jobs: `typescript` checks the side and runs its tests,
  # `typescript-apps` tests the demo, the DevTools extension and the page beside it, and
  # `typescript-coverage`, once the tests end, holds what they ran to the side's floor.
  # tools/ci-scope.mjs counts the last two as `typescript`'s own: they run in its scope, and its
  # verdict reads their results.
  #
  # `typescript`: types, lint and its plugin's cases, format, comment budget, doc examples, the
  # generated `Probe` held to its generator, its public surface held to `surface.txt` with its
  # options parameters, the generated interop's types and lint, the demo's static build and the
  # DevTools extension's, then its tests, cut into shards by Playwright's `--shard`. On the current
  # line and on the floor `engines.node` declares, so the floor holds by a run; on the current line,
  # each shard runs under c8 and hands on the raw V8 coverage it wrote. The interop against the C#
  # server runs in the .NET job, against the Rust one in the interop-rust job.
  typescript:
    name: TypeScript (Node ${{ matrix.node }}, shard ${{ matrix.shard }})
    needs: [scope, playwright]
    if: contains(fromJSON(needs.scope.outputs.areas), 'typescript')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # the image of the Playwright the side pins, Chromium in it: no browser to install
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-resolute
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        node: ['26', '24.9']
        # ! one entry a shard: TYPESCRIPT_SHARDS is its length
        shard: [1, 2]
    defaults:
      run:
        working-directory: implementations/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      # The download cache, not `node_modules`: cache what was downloaded, always install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('implementations/typescript/yarn.lock', 'builder/yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-node${{ matrix.node }}-
      # `--immutable` fails if `yarn.lock` would change.
      - run: $YARN install --immutable
      # the builder's packages too: the type-check reaches the builder's types from the demo
      - run: $YARN install --immutable
        working-directory: builder
      # What a line checks once, in its first shard: the side's gates, then bundling the demo's
      # static build, the folder beadproto.dev serves at /playground/, and the DevTools extension.
      - if: matrix.shard == 1
        run: $YARN check
      - if: matrix.shard == 1
        run: $YARN playground:build:file
      - if: matrix.shard == 1
        run: $YARN devtools:build
      - if: matrix.node != '26'
        run: >-
          $YARN test --shard "${{ matrix.shard }}/$TYPESCRIPT_SHARDS"
          --grep-invert "the (C#|Rust) server of the interop service"
      # On the current line, the same tests under c8, which writes no report: the raw V8 coverage of
      # each process, in coverage/tmp/, goes to typescript-coverage.
      - if: matrix.node == '26'
        run: >-
          $YARN c8 --reporter none playwright test --shard "${{ matrix.shard }}/$TYPESCRIPT_SHARDS"
          --grep-invert "the (C#|Rust) server of the interop service"
      - if: matrix.node == '26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-v8-typescript-${{ matrix.shard }}
          path: implementations/typescript/coverage/tmp/
          if-no-files-found: error
          retention-days: 1

  # The demo, the DevTools extension and the page, on the current line, each in a leg of its own.
  typescript-apps:
    name: TypeScript, ${{ matrix.title }}
    needs: [scope, playwright]
    if: contains(fromJSON(needs.scope.outputs.areas), 'typescript')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # the image of the Playwright the side pins, Chromium in it: no browser to install
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-resolute
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: devtools
            title: the DevTools extension
          - part: page
            title: the demo and the page
    defaults:
      run:
        working-directory: implementations/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('implementations/typescript/yarn.lock', 'builder/yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - run: $YARN install --immutable
      # the builder's packages too: the demo's Packages tab runs the builder's selection and its
      # reading of beadc.yaml, whose `yaml` the demo's tests reach from builder/
      - run: $YARN install --immutable
        working-directory: builder
      # The demo's static build, which both legs load.
      - run: $YARN playground:build:file
      # The DevTools extension, built, then tested: its pure modules, and itself loaded in Chromium
      # against the static build above, the image's own browser.
      - if: matrix.part == 'devtools'
        run: $YARN devtools:build
      - if: matrix.part == 'devtools'
        run: $YARN test:devtools
      # The demo's own tests: its procedures in Node, and its page, the static build above, in
      # Chromium.
      - if: matrix.part == 'page'
        run: $YARN test:demo
      # The page, the privacy policy, the not-found page and every scene of the demo, as
      # beadproto.dev serves them from out/, held to WCAG 2.2 AA by tools/check-a11y.mjs, after its
      # own tests, which fail here rather than skip.
      - if: matrix.part == 'page'
        name: WCAG 2.2 AA, the check's own tests
        working-directory: .
        env:
          BEAD_A11Y_REQUIRED: '1'
        run: node --test tools/__tests__/check-a11y.test.mjs
      - if: matrix.part == 'page'
        name: WCAG 2.2 AA, the page and the demo as served
        working-directory: .
        run: >-
          node --input-type=module -e "(await import('./site/deploy.mjs')).assemble({ day: '1970-01-01' })"
          && node tools/check-a11y.mjs --serve site/out / '/?lng=fr' /privacy/ '/privacy/?lng=fr'
          /nowhere /playground/
          '/playground/#calls' '/playground/#rules' '/playground/#openapi' '/playground/#server'
          '/playground/#code' '/playground/#packages'

  # The shards' raw coverage, reported by c8 as one run's: c8 merges the V8 coverage of every
  # process, whichever shard ran it, as it merges one run's workers. Then what the tests ran, held
  # to the TypeScript side's floor in tools/coverage-floors.json, the report in the run's summary.
  typescript-coverage:
    name: TypeScript's coverage
    needs: [scope, playwright, typescript]
    if: contains(fromJSON(needs.scope.outputs.areas), 'typescript')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # ! the shards' image, so the checkout sits at their path: the raw coverage names each file by
    # its absolute path, and c8 reads the sources there
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-resolute
    defaults:
      run:
        working-directory: implementations/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('implementations/typescript/yarn.lock', 'builder/yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - run: $YARN install --immutable
      # each shard's in a folder of its own name
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-v8-typescript-*
          path: implementations/typescript/coverage/shards
      # ! c8 reads its folder flat and passes over a file it cannot read: every shard is there, and
      # each file takes its shard's name before its own, so no two collide
      - name: The shards' raw coverage, in one folder
        run: |
          test "$(ls coverage/shards | wc -l)" -eq "$TYPESCRIPT_SHARDS"
          mkdir -p coverage/tmp
          for shard in coverage/shards/*; do
            for file in "$shard"/*.json; do
              cp "$file" "coverage/tmp/$(basename "$shard")-$(basename "$file")"
            done
          done
      - run: $YARN c8 report
      - name: Coverage, held to its floor
        working-directory: .
        run: >-
          node tools/coverage-report.mjs implementations/typescript/coverage/coverage-final.json
          --under implementations/typescript/src --floor typescript --summary "$GITHUB_STEP_SUMMARY"
      # the report to browse, c8's HTML and its lcov, kept with the run where it failed, the floor
      # among it: a green run's figures are its summary's
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-typescript
          path: |
            implementations/typescript/coverage/
            !implementations/typescript/coverage/shards/
            !implementations/typescript/coverage/tmp/
          retention-days: 14

  # ── .NET ─────────────────────────────────────────────────────────────────────
  # The C# side's gate — `dotnet format --verify-no-changes` holds the layout, the code style and
  # the analyzers, the generated folders left to their generator; `dotnet build` builds every
  # project with every warning an error, the builder's C# goldens among them, which `Bead.Goldens`
  # compiles under this side's rules as a consumer compiles them, and holds each `src` project's
  # public surface to its `PublicAPI.Shipped.txt` and `PublicAPI.Unshipped.txt` by
  # PublicApiAnalyzers; `dotnet test` runs the tests under
  # coverage, held to the side's floor — and the interop, both ways: the C# client against the
  # TypeScript server, which `dotnet test` starts with Node, then the TypeScript client against the
  # C# server; then a page of another origin in Chromium against both sides' HTTP servers, what
  # proves a browser reads their CORS answer. Only the TypeScript side is installed, for its interop
  # server and its page; Chromium is the Playwright image's. The interop with the Rust side, its
  # cases and its fixture, is the interop-rust job's.
  #
  # `BEAD_INTEROP_REQUIRED=1` turns an interop that would skip into one that fails: here a skip
  # could only be a path to the other side gone wrong.
  #
  # From `implementations/dotnet`: `dotnet` finds `global.json`, which holds the SDK and the test
  # runner, by walking up from where it runs. `CI=true` turns on `RestoreLockedMode` in
  # `Directory.Build.props`: a restore that would change a `packages.lock.json` fails.
  dotnet:
    name: .NET
    needs: [scope, playwright]
    if: contains(fromJSON(needs.scope.outputs.areas), 'dotnet')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # the image of the Playwright the TypeScript side pins, for the page of another origin's Chromium
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-resolute
      options: --ipc=host
    env:
      BEAD_INTEROP_REQUIRED: 1
    defaults:
      run:
        working-directory: implementations/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: implementations/dotnet/global.json
          cache: true
          cache-dependency-path: implementations/dotnet/**/packages.lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: $YARN install --immutable
        working-directory: implementations/typescript
      - run: dotnet format Bead.slnx --verify-no-changes --exclude ../../builder/test/golden/csharp interop/Bead.Interop/Generated tests/Bead.Protobuf.Tests/Generated
      # every project, which `dotnet test` does not: it builds the test projects alone
      - run: dotnet build Bead.slnx
      # the bench, outside Bead.slnx, built so that a release's measure finds it whole
      - run: dotnet build -c Release tools/Bead.Benchmarks
      # the tests under coverage, one cobertura report per test project, then what they ran held to
      # the C# side's floor in tools/coverage-floors.json, the report in the run's summary; the
      # interop's fixture against the Rust server left to the interop-rust job
      - run: >-
          dotnet test --solution Bead.slnx --coverage --coverage-output-format cobertura
          --results-directory TestResults/coverage --filter-not-trait "server=Rust"
      - name: Coverage, held to its floor
        run: >-
          node ../../tools/coverage-report.mjs TestResults/coverage/*.cobertura.xml
          --under implementations/dotnet/src --floor csharp --summary "$GITHUB_STEP_SUMMARY"
      # each test project's cobertura report, kept with the run where it failed, the floor among it: a
      # green run's figures are its summary's
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-csharp
          path: implementations/dotnet/TestResults/coverage/*.cobertura.xml
          retention-days: 14
      - run: $YARN test:interop --grep-invert "the Rust server"
        working-directory: implementations/typescript
      - run: $YARN test:browser
        working-directory: implementations/typescript

  # ── Rust ─────────────────────────────────────────────────────────────────────
  # The Rust side's own gate (decision 0044): its toolchain from its rust-toolchain.toml, a warning
  # an error by its .cargo/config.toml, `[build] warnings = "deny"`. Here, on Linux, its format, a
  # build on the default features alone, where what the test kit alone reaches is left out, the
  # interop's server and its trials' test binary, built once and handed to the interop-rust job,
  # and its dependencies' advisories, licences, bans and sources. Its lints and its documentation
  # are rust-lints', its tests under coverage rust-coverage's, its fuzz targets rust-fuzz's, and its
  # tests on Windows rust-windows', each beside this job. The registry and the target are cached by
  # the lock and the toolchain, each job's under a key of its own; every build is `--locked`.
  rust:
    name: Rust
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'rust')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementations/rust
        # ! bash by name, which runs with pipefail: a cargo failing inside a pipe fails its step
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 1.99.1, its components, clippy, rustfmt and llvm-tools, and its target
      # wasm32-unknown-unknown, as rust-toolchain.toml names them
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            implementations/rust/target
          key: rust-build-ubuntu-26.04-${{ hashFiles('implementations/rust/Cargo.lock', 'implementations/rust/rust-toolchain.toml') }}
          restore-keys: rust-build-ubuntu-26.04-
      # cargo-deny's prebuilt release, checked by its SHA-256 against the action's manifest
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2
      - run: cargo fmt --all -- --check
      # the default features alone: what the test kit alone reaches is cfg'd out, or a warning
      - run: cargo build --workspace --locked
      # the interop's server and its trials' test binary, for the interop-rust job, which has no
      # Rust toolchain: each one's path read from cargo's JSON, the test binary's named by a hash,
      # both copied to one folder under the names that job runs them by
      - name: The interop's server and its trials, built
        run: |
          server="$(cargo build -p francisdesjardins-bead-interop-server --locked --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "bead-interop-server" and .executable != null) | .executable')"
          trials="$(cargo test -p francisdesjardins-bead-interop-server --no-run --locked --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "interop" and .executable != null) | .executable')"
          test -f "$server"
          test -f "$trials"
          mkdir -p "$RUNNER_TEMP/rust-interop"
          cp "$server" "$RUNNER_TEMP/rust-interop/bead-interop-server"
          cp "$trials" "$RUNNER_TEMP/rust-interop/interop"
      # kept a day: the interop-rust job of the same run reads it, nothing after
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-interop
          path: ${{ runner.temp }}/rust-interop/
          if-no-files-found: error
          retention-days: 1
      - run: cargo deny --locked check
      # the projects outside the workspace, each by its own lock, held to the workspace's deny.toml,
      # cargo-deny's default, the one in the folder it runs from: the fuzz targets, the conformance
      # player, the protovalidate differential's testee and hello's Rust half
      - run: cargo deny --manifest-path fuzz/Cargo.toml --locked check
      - run: cargo deny --manifest-path tools/protobuf-conformance/Cargo.toml --locked check
      - run: cargo deny --manifest-path tools/protovalidate-differential/Cargo.toml --locked check
      - run: cargo deny --manifest-path ../../examples/hello/rust/Cargo.toml --locked check

  # The Rust side's tests on Windows, as the user's MSVC toolchain builds them.
  rust-windows:
    name: Rust's tests on Windows
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'rust')
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        working-directory: implementations/rust
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            implementations/rust/target
          key: rust-windows-2025-${{ hashFiles('implementations/rust/Cargo.lock', 'implementations/rust/rust-toolchain.toml') }}
          restore-keys: rust-windows-2025-
      - run: cargo test --workspace --all-features --locked

  # The Rust side's lints, by its workspace's `[lints]` table: clippy over every member and target
  # with every feature, then on each member's default features; the core's library with no
  # feature, then with each socket transport's alone, with its MQTT 5 binding's alone, and with its
  # gateway's routes alone, then its gateway whole, and bead-protobuf's with its JSON mapping alone,
  # so that each builds on its own (decisions 0049, 0050, 0052); the core on the browser's
  # WebAssembly; then its documentation.
  rust-lints:
    name: Rust's lints
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'rust')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementations/rust
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 1.99.1, its components and its target wasm32-unknown-unknown, as rust-toolchain.toml names
      # them
      - run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            implementations/rust/target
          key: rust-lints-ubuntu-26.04-${{ hashFiles('implementations/rust/Cargo.lock', 'implementations/rust/rust-toolchain.toml') }}
          restore-keys: rust-lints-ubuntu-26.04-
      - run: cargo clippy --workspace --all-targets --all-features --locked
      # each member on its default features too, where what a feature alone builds is left out
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo clippy -p francisdesjardins-bead --lib --locked
      - run: cargo clippy -p francisdesjardins-bead --lib --features websocket --locked
      - run: cargo clippy -p francisdesjardins-bead --lib --features http --locked
      - run: cargo clippy -p francisdesjardins-bead --lib --features mqtt --locked
      - run: cargo clippy -p francisdesjardins-bead --lib --features transcoding --locked
      - run: cargo clippy -p francisdesjardins-bead --lib --features gateway --locked
      - run: cargo clippy -p francisdesjardins-bead-protobuf --lib --features transcoding --locked
      # the core checked for the browser's WebAssembly, never run, the target rust-toolchain.toml's,
      # by its features, its transcoding among them, no socket, which mio refuses there, nor its
      # gateway, which listens on one: what it links builds there, its spawning and its time through
      # crate::platform and the clock alone; getrandom's backend for the target is
      # .cargo/config.toml's
      - run: cargo clippy -p francisdesjardins-bead --lib --features testing,transcoding --locked --target wasm32-unknown-unknown
      - run: cargo doc --workspace --no-deps --all-features --locked

  # The Rust side's tests under instrumentation, bead-house's holding each library crate's public
  # surface to its list and the conformance players among them, every test binary's profile merged
  # into one LLVM export: lines and regions on the pinned stable, held to the side's floor in
  # tools/coverage-floors.json. Then the tests' descriptor set, held to what protoc writes at its
  # pin.
  rust-coverage:
    name: Rust's coverage
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'rust')
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: implementations/rust
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      # the instrumented build, under target/llvm-cov-target
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            implementations/rust/target
          key: rust-coverage-ubuntu-26.04-${{ hashFiles('implementations/rust/Cargo.lock', 'implementations/rust/rust-toolchain.toml') }}
          restore-keys: rust-coverage-ubuntu-26.04-
      # cargo-llvm-cov's prebuilt release, checked by its SHA-256 against the action's manifest
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1
      # the unit tests, a module's tests.rs and its tests/ folder, the test kit, the code beadc
      # writes, under a generated/ folder, and the goldens' crate that compiles it left out of the
      # export
      - run: >-
          cargo llvm-cov --workspace --all-features --locked --json --summary-only
          --ignore-filename-regex '([/\\]tests\.rs|[/\\]tests[/\\].*|[/\\]testing\.rs|[/\\]testing[/\\].*|[/\\]generated[/\\].*|[/\\]crates[/\\]bead-goldens[/\\].*)$'
          --output-path coverage/rust.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Coverage, held to its floor
        run: >-
          node ../../tools/coverage-report.mjs coverage/rust.json
          --under implementations/rust/crates/bead/src --under implementations/rust/crates/bead-protobuf/src
          --floor rust --summary "$GITHUB_STEP_SUMMARY"
      # the export, kept with the run where it failed, the floor among it: a green run's figures are
      # its summary's
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: implementations/rust/coverage/rust.json
          retention-days: 14
      # the set the tests' proto messages are generated from, as protoc writes it at its pin, which
      # builder/tools/fetch-protoc.mjs fetches and checks by its sha256
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: builder/.protoc
          key: protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('builder/protoc.json') }}
      - name: The tests' descriptor set
        run: node tools/check-protobuf.mjs

  # The Rust side's fuzz targets, built on the nightly their sanitizer needs, never run: cargo-fuzz
  # from its source on crates.io, by its lock, since install-action's manifest has no prebuilt
  # release of it. The targets' workspace is their own, its target uncached.
  rust-fuzz:
    name: Rust's fuzz targets
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'rust')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementations/rust/fuzz
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # ! the nightly of the fuzz build alone, by its date: tools/fuzz.mjs's RUST_NIGHTLY names the
      # same, and both move together, by hand
      NIGHTLY: nightly-2026-10-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - run: cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +"$NIGHTLY" fuzz build
        env:
          # a newer compiler's warnings are no gate of the pinned one's
          CARGO_BUILD_WARNINGS: warn

  # ── Interop with the Rust side ───────────────────────────────────────────────
  # The interop with the Rust side, both ways, over WebSocket, over HTTP and through each side's
  # gateway (decisions 0049, 0052): the Rust client's trials against each side's server and its
  # gateway, the TypeScript client and the C# one against the Rust server and its gateway, then a
  # page of another origin in Chromium against its HTTP server, what proves a browser reads its CORS
  # answer. The Rust server and the trials' test binary are the Rust job's, built once there, so no
  # Rust toolchain and no C compiler here. In the Playwright image the .NET job runs, Ubuntu 26.04
  # as the Rust job's runner, so the binaries find the glibc they were linked against; .NET and the
  # TypeScript side installed as the .NET job has them, for the servers the trials start and for
  # the clients against the Rust one, the C# server built first so that no trial waits on its build.
  #
  # `BEAD_INTEROP_REQUIRED=1` turns an interop that would skip into one that fails, and
  # `BEAD_INTEROP_RUST=1` asks for the Rust trials, which are ignored otherwise.
  interop-rust:
    name: Interop with the Rust side
    needs: [scope, playwright, rust]
    if: contains(fromJSON(needs.scope.outputs.areas), 'interop-rust')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # the image of the Playwright the TypeScript side pins, for the page of another origin's Chromium
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-resolute
      options: --ipc=host
    env:
      BEAD_INTEROP_REQUIRED: 1
      BEAD_INTEROP_RUST: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: implementations/dotnet/global.json
          cache: true
          cache-dependency-path: implementations/dotnet/**/packages.lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: $YARN install --immutable
        working-directory: implementations/typescript
      - run: dotnet build interop/Bead.Interop.Server
        working-directory: implementations/dotnet
      - run: dotnet build tests/Bead.Interop.Tests
        working-directory: implementations/dotnet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-interop
          path: rust-interop
      # ! the container's paths, from the shell: in a container job, `github.workspace` names the
      # runner's host path, which the container does not see. An artifact keeps no mode, so each
      # binary is made executable again.
      - name: The Rust side's binaries, where the runs find them
        run: |
          chmod +x rust-interop/bead-interop-server rust-interop/interop
          echo "BEAD_INTEROP_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "BEAD_INTEROP_RUST_SERVER=$GITHUB_WORKSPACE/rust-interop/bead-interop-server" >> "$GITHUB_ENV"
      - name: The Rust client against each side's server
        run: rust-interop/interop
      - run: $YARN test:interop --grep "the Rust server"
        working-directory: implementations/typescript
      - run: dotnet test --project tests/Bead.Interop.Tests --filter-trait "server=Rust"
        working-directory: implementations/dotnet
      # every server among the page's targets, the Rust one with them
      - run: $YARN test:browser
        working-directory: implementations/typescript

  # ── MQTT 5 ───────────────────────────────────────────────────────────────────
  # The cases over MQTT 5, each adapter against the fixture over TCP and WebSocket, the interop over
  # MQTT 5 both ways, the internal demo's sign-up and a page's client over WebSocket, against a
  # Mosquitto 2.1.2 of the run's own, by its digest, a password drawn for the run (decision 0041).
  # On the runner's host, where Docker is: the Playwright image of the other jobs reaches none, and
  # a service container starts before any step could draw its password. The Rust side's are
  # mqtt-rust's, beside this job, against a broker of its own. `BEAD_MQTT_REQUIRED=1` turns a case
  # that would skip without a broker into one that fails, as `BEAD_INTEROP_REQUIRED=1` does the
  # interop's.
  mqtt:
    name: MQTT 5, against Mosquitto
    needs: [scope, playwright]
    if: contains(fromJSON(needs.scope.outputs.areas), 'mqtt')
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      BEAD_MQTT_REQUIRED: 1
      BEAD_INTEROP_REQUIRED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: implementations/dotnet/global.json
          cache: true
          cache-dependency-path: implementations/dotnet/**/packages.lock.json
      - name: Locate the Yarn cache
        id: yarn-cache
        working-directory: implementations/typescript
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('implementations/typescript/yarn.lock', 'builder/yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - run: $YARN install --immutable
        working-directory: implementations/typescript
      # the builder's packages too: the demo's unit tests, loaded whole, reach its `yaml` from
      # builder/ through the Packages tab's
      - run: $YARN install --immutable
        working-directory: builder
      - name: Mosquitto 2.1.2 by its digest, a password drawn for this run
        run: node tools/mqtt-broker.mjs start --github-env
      # the cases over MQTT 5, the adapter over WebSocket, and the TypeScript client over MQTT 5
      - run: $YARN test:mqtt
        working-directory: implementations/typescript
      # the internal demo's server and its page's client over MQTT 5, as `?transport=mqtt` links them
      - run: $YARN test:demo --project unit --grep "over MQTT 5"
        working-directory: implementations/typescript
      - run: dotnet test --project tests/Bead.Transport.Mqtt.Tests
        working-directory: implementations/dotnet
      - run: dotnet test --project tests/Bead.Interop.Tests --filter-trait "transport=MQTT"
        working-directory: implementations/dotnet
      - run: $YARN playwright install --with-deps chromium && $YARN test:browser --grep "MQTT 5"
        working-directory: implementations/typescript
        env:
          # the page's leg installs its Chromium, which no image of this job holds
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0
      - run: $YARN devtools:build && $YARN playground:build:file && $YARN test:devtools --grep "over MQTT 5"
        working-directory: implementations/typescript
      # the demo's page over MQTT 5 in Chromium, a glyph sent and one received
      - run: $YARN test:demo --project page --grep "over MQTT 5"
        working-directory: implementations/typescript
      # the broker start left, which a start that failed left none of
      - name: The broker stopped
        if: always()
        run: if [ -n "${BEAD_MQTT_BROKER:-}" ]; then node tools/mqtt-broker.mjs stop; fi

  # The Rust side over MQTT 5 (decision 0050), against a Mosquitto of its own, as the mqtt job
  # starts one: its cases, its adapter's twins, the fixture's among them, its client against each
  # side's server, and the TypeScript and C# clients against its server. Built on the toolchain its
  # rust-toolchain.toml pins, its registry and target cached under a key of its own; on the
  # runner's host, for Docker and the C compiler the Rust side's TLS builds with.
  mqtt-rust:
    name: MQTT 5 on the Rust side, against Mosquitto
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'mqtt')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BEAD_MQTT_REQUIRED: 1
      BEAD_INTEROP_REQUIRED: 1
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: implementations/dotnet/global.json
          cache: true
          cache-dependency-path: implementations/dotnet/**/packages.lock.json
      - name: Locate the Yarn cache
        id: yarn-cache
        working-directory: implementations/typescript
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('implementations/typescript/yarn.lock', 'builder/yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - run: $YARN install --immutable
        working-directory: implementations/typescript
      - name: Mosquitto 2.1.2 by its digest, a password drawn for this run
        run: node tools/mqtt-broker.mjs start --github-env
      # 1.99.1 and its components, as rust-toolchain.toml names them
      - run: rustup toolchain install
        working-directory: implementations/rust
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            implementations/rust/target
          key: mqtt-rust-ubuntu-26.04-${{ hashFiles('implementations/rust/Cargo.lock', 'implementations/rust/rust-toolchain.toml') }}
          restore-keys: mqtt-rust-ubuntu-26.04-
      # its cases over MQTT 5 and its vectors, then its adapter's twins, the fixture's among them
      - run: cargo test -p francisdesjardins-bead --features testing,mqtt --locked --test transports --test vectors
        working-directory: implementations/rust
      - run: >-
          cargo test -p francisdesjardins-bead --features testing,mqtt --locked --lib mqtt::
        working-directory: implementations/rust
      # its interop server, which the TypeScript and C# clients call, and the C# one built before
      # the trials start it, so that no trial waits on its build
      - run: cargo build -p francisdesjardins-bead-interop-server --locked
        working-directory: implementations/rust
      - run: dotnet build interop/Bead.Interop.Server
        working-directory: implementations/dotnet
      # the Rust client against each side's server, over MQTT 5 alone
      - name: The Rust client against each side's server over MQTT 5
        run: >-
          cargo test -p francisdesjardins-bead-interop-server --locked --test interop -- ::mqtt::
        working-directory: implementations/rust
        env:
          BEAD_INTEROP_RUST: 1
      # the TypeScript and C# clients against the Rust server, over MQTT 5 alone
      - run: $YARN test:interop --grep "the Rust server.*over MQTT 5"
        working-directory: implementations/typescript
        env:
          BEAD_INTEROP_RUST_SERVER: ${{ github.workspace }}/implementations/rust/target/debug/bead-interop-server
      - run: dotnet test --project tests/Bead.Interop.Tests --filter-query "/[(server=Rust)&(transport=MQTT)]"
        working-directory: implementations/dotnet
        env:
          BEAD_INTEROP_RUST_SERVER: ${{ github.workspace }}/implementations/rust/target/debug/bead-interop-server
      # the broker start left, which a start that failed left none of
      - name: The broker stopped
        if: always()
        run: if [ -n "${BEAD_MQTT_BROKER:-}" ]; then node tools/mqtt-broker.mjs stop; fi

  # ── AMQP 1.0 ─────────────────────────────────────────────────────────────────
  # The cases over AMQP 1.0, each adapter against the fixture, and the interop over AMQP 1.0 both
  # ways, against a RabbitMQ 4.4.0 of the run's own, by its digest, a password drawn for the run, its
  # heartbeat lowered so that an id's lockout after a silent loss is waited out in about 40 s
  # (decision 0043). On the runner's host, as the MQTT 5 job is, and with no page leg: no page reaches
  # an AMQP 1.0 broker. `BEAD_AMQP_REQUIRED=1` turns a case that would skip without a broker into one
  # that fails, as `BEAD_INTEROP_REQUIRED=1` does the interop's.
  amqp:
    name: AMQP 1.0, against RabbitMQ
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'amqp')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      BEAD_AMQP_REQUIRED: 1
      BEAD_INTEROP_REQUIRED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: implementations/dotnet/global.json
          cache: true
          cache-dependency-path: implementations/dotnet/**/packages.lock.json
      - name: Locate the Yarn cache
        id: yarn-cache
        working-directory: implementations/typescript
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('implementations/typescript/yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - run: $YARN install --immutable
        working-directory: implementations/typescript
      - name: RabbitMQ 4.4.0 by its digest, a password and TLS certificates drawn for this run
        run: node tools/amqp-broker.mjs start --github-env
      # the cases over AMQP 1.0, the adapter against the fixture, and the TypeScript client over
      # AMQP 1.0, with the participants over TLS and SASL EXTERNAL among the adapter twins
      - name: TypeScript AMQP 1.0, TLS and SASL EXTERNAL included
        run: $YARN test:amqp
        working-directory: implementations/typescript
      - name: C# AMQP 1.0, TLS and SASL EXTERNAL included
        run: dotnet test --project tests/Bead.Transport.Amqp.Tests
        working-directory: implementations/dotnet
      - run: dotnet test --project tests/Bead.Interop.Tests --filter-trait "transport=AMQP"
        working-directory: implementations/dotnet
      # the broker start left, which a start that failed left none of
      - name: The broker stopped
        if: always()
        run: if [ -n "${BEAD_AMQP_BROKER:-}" ]; then node tools/amqp-broker.mjs stop; fi

  # ── Builder ──────────────────────────────────────────────────────────────────
  # beadc's own gate, from builder/, its toolchain its own. On Linux: types, the goldens' types,
  # lint, format, buf's lint and format over its options and its fixtures, and the options'
  # generated code held to its generator, none of which a platform moves. On every leg: protoc, the
  # one `protoc.json` pins, fetched and checked by its sha256, then its tests, the interop's .proto
  # among them, whose blueprint is the spec's byte for byte in either line ending, and the goldens of
  # both targets, protoc's C# messages among them; then beadc itself over the interop's blueprint,
  # its rules and its form, then each side's interop to what beadc generates from the root's
  # `beadc.yaml`, and the demo's sign-up service to what it generates from the demo's, then, on
  # Linux, `beadc breaking`, the interop's blueprint and `examples/hello`
  # against the last release that carries one, from 0.3.0. On Windows, where buf and protoc are
  # other binaries, on the current line; on Linux, on the floor `engines.node` declares too. The C#
  # goldens build in the .NET job, which has the SDK. The wrappers, `beadc.sh` and `beadc.ps1`, are
  # held to one contract on every leg, against a stand-in engine. On the image's legs, Linux on
  # Node 26, amd64 and arm64, each natively: beadc's image built from `builder/Dockerfile`, then
  # the tests from `builder/`, where each wrapper runs the image it built, over the repository's
  # projects and `examples/hello`; and the wrappers' lint, each linter at its pin. The image's test
  # stage, beadc's tests on the image's Node, protoc and environment, is builder-image's.
  #
  # `BEADC_PROTOC_REQUIRED=1` turns a test that would skip without protoc into one that fails, and
  # `BEADC_PROTOC_GEN_BUFFA_REQUIRED=1` one that would skip without protoc-gen-buffa: here a skip
  # could only be a fetch gone wrong.
  builder:
    name: Builder (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'builder')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BEADC_PROTOC_REQUIRED: 1
      BEADC_PROTOC_GEN_BUFFA_REQUIRED: 1
      # a wrapper's test that would skip without bash, pwsh 7.6 or, on Windows, the right to make a
      # symbolic link fails: every runner has them
      BEADC_WRAPPERS_REQUIRED: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
        node: ['26']
        include:
          - os: ubuntu-26.04
            node: '24.9'
          # the image, on each architecture natively: the first include marks the Linux Node 26
          # leg, which GitHub merges, adding no leg
          - os: ubuntu-26.04
            node: '26'
            image: true
          # ! arm64 natively, on every push: its own leg, counted against the account's minutes in a
          # private repository; taken out, the image is amd64's alone until a release builds arm64
          - os: ubuntu-26.04-arm
            node: '26'
            image: true
    defaults:
      run:
        working-directory: builder
        # Git Bash on Windows, so `$YARN` and every step read alike on both
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      # The download cache, not `node_modules`: cache what was downloaded, always install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: builder-yarn-cache-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-${{ hashFiles('builder/yarn.lock') }}
          restore-keys: builder-yarn-cache-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-
      # `--immutable` fails if `yarn.lock` would change.
      - run: $YARN install --immutable
      # protoc's archive, extracted, by the pin it was checked against
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: builder/.protoc
          key: protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('builder/protoc.json') }}
      # assigned first: a failed fetch fails the step, which a substitution inside echo's arguments
      # would not
      - name: protoc, by its pin's sha256
        run: |
          protoc="$(node tools/fetch-protoc.mjs)"
          echo "BEADC_PROTOC=$protoc" >> "$GITHUB_ENV"
      # protoc-gen-buffa's binary, by the pin it was checked against: the Rust target's messages,
      # its goldens' and every Rust output's that generates them
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: builder/.protoc-gen-buffa
          key: protoc-gen-buffa-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('builder/protoc-gen-buffa.json') }}
      - name: protoc-gen-buffa, by its pin's sha256
        run: |
          plugin="$(node tools/fetch-protoc-gen-buffa.mjs)"
          echo "BEADC_PROTOC_GEN_BUFFA=$plugin" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: $YARN check
      # the image, which the tests after it run each wrapper against
      - if: matrix.image
        name: The image
        working-directory: .
        run: |
          docker build -f builder/Dockerfile -t beadc:ci .
          echo "BEADC_IMAGE=beadc:ci" >> "$GITHUB_ENV"
          echo "BEADC_IMAGE_REQUIRED=1" >> "$GITHUB_ENV"
      # shellcheck from its image by digest, PSScriptAnalyzer at its version: a new default rule
      # reaches the wrappers by a change of a pin, never by a runner's update
      - if: matrix.image
        name: The wrappers' lint, each linter at its pin
        run: |
          docker run --rm -v "$PWD/wrappers:/mnt:ro" koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d -S style /mnt/beadc.sh
          pwsh -NoProfile -Command '
            if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq ([version] "1.25.0"))) {
              Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
            }
            Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
            Invoke-ScriptAnalyzer -Path wrappers/beadc.ps1 -EnableExit'
      - run: $YARN test
      - name: The interop's blueprint, to beadc's rules
        run: node src/cli.ts check ../spec/interop-blueprint.json
      - name: The interop's blueprint, in its form
        run: node src/cli.ts blueprint --check ../spec/interop-blueprint.json
      - name: Each side's interop, what beadc generates from its blueprint
        working-directory: .
        run: node builder/src/cli.ts generate --check
      - name: The demo's sign-up service, what beadc generates from its .proto
        working-directory: implementations/typescript/demo
        run: node ../../../builder/src/cli.ts generate --check
      - name: Each side's validators of spec/validations.proto, what beadc generates for it
        working-directory: .
        run: node tools/check-validations.mjs
      - name: Each side's route table and document of spec/transcoding.proto, what beadc generates for it
        working-directory: .
        run: node tools/check-transcoding.mjs
      # ! beadc breaking, against the last release, the interop's blueprint and examples/hello's:
      # the last release carries both, and one without fails the step, so it never passes by
      # comparing nothing. The last release is the newest
      # vX.Y.Z, as tools/release.mjs reads one, whose commit is not HEAD's: on a release's own
      # commit, the one before it, so a waiver the release carried still waives its change. Read by
      # the tag's commit, never by ancestry, which the shallow fetch does not hold. Every warning
      # fails, WAIVER_UNUSED's among them: a waiver that waived nothing is taken out
      - if: runner.os == 'Linux'
        name: The interop's blueprint and examples/hello, against the last release
        working-directory: .
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          head="$(git rev-parse HEAD)"
          tag=""
          for each in $(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -r); do
            if [ "$(git rev-parse "$each^{commit}")" != "$head" ]; then
              tag="$each"
              break
            fi
          done
          if [ -z "$tag" ] || ! git cat-file -e "$tag:spec/interop-blueprint.json" 2> /dev/null; then
            echo "::error title=beadc breaking::${tag:-no v* tag} carries no spec/interop-blueprint.json"
            exit 1
          fi
          git archive --format=tar "$tag" | node builder/src/cli.ts breaking --against - --error-format github --fail-on-warning
          cd examples/hello
          git archive --format=tar "$tag" | node ../../builder/src/cli.ts breaking --against - --error-format github --fail-on-warning

  # beadc's tests on its image, the Dockerfile's test stage built on the image itself: the image's
  # Node, its protoc and its environment, the tests and the files of the repository they read laid
  # over it. On each architecture natively, beside the builder job's image legs, which build the
  # image again for the wrappers' tests.
  builder-image:
    name: beadc's image, tested (${{ matrix.os }})
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'builder')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # ! the arm64 leg goes with the builder job's, whose note says what it costs
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f builder/Dockerfile --target test .

  # ── Examples ─────────────────────────────────────────────────────────────────
  # Each project of examples/, written as a consumer writes one, its runtimes from their source: a
  # Yarn portal, a ProjectReference and a Cargo path. First what the examples copy or take from
  # beadc, held to their source; then examples/hello: beadc on Node from builder/ holds its
  # generated files and writes the copy of Bead's options its external builds read; buf's lint and
  # layout over its .proto; each half's gates and both its builds; then each client against each
  # server, both modes of each half, each server's gateway asked after its client, every one
  # writing transcript.txt, every server ending clean.
  # On the current line and on the floor the TypeScript half's engines.node declares. The Rust half
  # on the current line's leg alone, on the toolchain its rust-toolchain.toml pins, the Rust side's,
  # its two binaries over one target folder: its pairs played there, Node's floor no part of it.
  # The wrappers run over it on the builder job's image legs, where the image is.
  examples:
    name: Examples (Node ${{ matrix.node }})
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'examples')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['26', '24.9']
        include:
          - node: '26'
            rust: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: examples/hello/dotnet/global.json
          cache: true
          cache-dependency-path: |
            examples/*/dotnet/packages.lock.json
            implementations/dotnet/src/**/packages.lock.json
      - name: Locate the Yarn cache
        id: yarn-cache
        working-directory: builder
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      # The download cache, not `node_modules`: cache what was downloaded, always install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: examples-yarn-cache-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('builder/yarn.lock', 'examples/*/typescript/yarn.lock') }}
          restore-keys: examples-yarn-cache-${{ runner.os }}-node${{ matrix.node }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: builder/.protoc
          key: protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('builder/protoc.json') }}
      # `--immutable` fails if `yarn.lock` would change.
      - run: $YARN install --immutable
        working-directory: builder
      # assigned first: a failed fetch fails the step
      - name: protoc, by its pin's sha256
        working-directory: builder
        run: |
          protoc="$(node tools/fetch-protoc.mjs)"
          echo "BEADC_PROTOC=$protoc" >> "$GITHUB_ENV"
      # the Rust half's messages, beadc's through Buffa's plugin, held on every leg
      - name: protoc-gen-buffa, by its pin's sha256
        working-directory: builder
        run: |
          plugin="$(node tools/fetch-protoc-gen-buffa.mjs)"
          echo "BEADC_PROTOC_GEN_BUFFA=$plugin" >> "$GITHUB_ENV"
      - name: What each example copies, or takes from beadc's wrapper and init
        run: node tools/check-examples.mjs
      # held first, then written: generate writes the same files again, and the copy of Bead's
      # options, git's to ignore, which buf and Grpc.Tools read
      - name: hello's generated files, what beadc writes
        working-directory: examples/hello
        run: |
          node ../../builder/src/cli.ts generate --check
          node ../../builder/src/cli.ts generate
          git diff --exit-code
      - run: $YARN install --immutable
        working-directory: examples/hello/typescript
      - name: hello's .proto, buf's lint and layout
        working-directory: examples/hello
        run: |
          typescript/node_modules/.bin/buf lint
          typescript/node_modules/.bin/buf format --diff --exit-code
      - run: $YARN check
        working-directory: examples/hello/typescript
      - run: $YARN build && $YARN build:external
        working-directory: examples/hello/typescript
      - run: dotnet format Hello.csproj --verify-no-changes --exclude gen
        working-directory: examples/hello/dotnet
      - run: dotnet build && dotnet build -p:HelloMessages=external
        working-directory: examples/hello/dotnet
        env:
          CI: true
      # 1.99.1, as examples/hello/rust/rust-toolchain.toml names it, the Rust side's pin
      - if: matrix.rust
        run: rustup toolchain install
        working-directory: examples/hello/rust
      # the registry and the Rust half's build, by its own lock and its toolchain
      - if: matrix.rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            examples/hello/rust/target
          key: examples-rust-${{ hashFiles('examples/hello/rust/Cargo.lock', 'examples/hello/rust/rust-toolchain.toml', 'implementations/rust/Cargo.lock') }}
          restore-keys: examples-rust-
      - if: matrix.rust
        run: cargo fmt --check
        working-directory: examples/hello/rust
      # the feature external's build script builds its set with the TypeScript half's buf, the one
      # the lint above ran
      - if: matrix.rust
        run: cargo clippy --all-targets --locked && cargo clippy --all-targets --features external --locked
        working-directory: examples/hello/rust
        env:
          BUF: ${{ github.workspace }}/examples/hello/typescript/node_modules/.bin/buf
      # both binaries over one target folder: hello, then hello-external with the feature external
      - if: matrix.rust
        run: cargo build --locked && cargo build --features external --locked
        working-directory: examples/hello/rust
        env:
          BUF: ${{ github.workspace }}/examples/hello/typescript/node_modules/.bin/buf
      - name: Each client against each server
        run: node examples/hello/pairs.mjs
        env:
          # the Rust half's pairs where it is built; any other word leaves them out
          HELLO_RUST: ${{ matrix.rust && 'built' || 'absent' }}

  # ── Protobuf conformance ─────────────────────────────────────────────────────
  # Protobuf's conformance suite through each side's generated `proto` codec, the check of a
  # payload's records in front of its library, and its mapping of protobuf's JSON, binary and JSON,
  # recommended enforced, every edition, at the release both libraries pin (decisions 0028 and
  # 0037): the runner `tools/protobuf-conformance/runner.json`
  # pins, fetched and checked by its sha512 as protoc is by its sha256, against each side's testee
  # and its failure list, which the runner holds both ways, then the floor of tests run; then one
  # corpus of Probe through every side's testee, read alike, compared two by two, after the suite
  # step that built the Rust testee. A job of its own: it needs every side's runtime, beadc and
  # protoc, which no other job has together; the Rust testee's JSON goes through Bead's own mapping,
  # bead-protobuf's `JsonForm`, as the gateway reads and writes it (decision 0052).
  # The C# testee lies outside Bead.slnx, so its format is held here, by name, the code generated
  # into it at run time aside; `CI=true`, the runner's own, restores it locked.
  protobuf-conformance:
    name: Protobuf conformance
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'protobuf-conformance')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: implementations/dotnet/global.json
          cache: true
          cache-dependency-path: implementations/dotnet/**/packages.lock.json
      - name: Locate the Yarn cache
        id: yarn-cache
        working-directory: builder
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      # The download cache, not `node_modules`: cache what was downloaded, always install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: protobuf-conformance-yarn-cache-${{ runner.os }}-${{ hashFiles('builder/yarn.lock', 'implementations/typescript/yarn.lock') }}
          restore-keys: protobuf-conformance-yarn-cache-${{ runner.os }}-
      # `--immutable` fails if `yarn.lock` would change.
      - run: $YARN install --immutable
        working-directory: implementations/typescript
      - run: $YARN install --immutable
        working-directory: builder
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: builder/.protoc
          key: protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('builder/protoc.json') }}
      # assigned first: a failed fetch fails the step
      - name: protoc, by its pin's sha256
        working-directory: builder
        run: |
          protoc="$(node tools/fetch-protoc.mjs)"
          echo "BEADC_PROTOC=$protoc" >> "$GITHUB_ENV"
      # the runner's package, unpacked, by the pin it was checked against
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/protobuf-conformance/.runner
          key: protobuf-conformance-${{ runner.os }}-${{ hashFiles('tools/protobuf-conformance/runner.json') }}
      - name: The suite through the TypeScript side's codec
        run: node tools/protobuf-conformance.mjs typescript
      - name: The suite through the C# side's codec
        run: node tools/protobuf-conformance.mjs csharp
      - name: The C# testee's format
        working-directory: implementations/dotnet/tools/Bead.ProtobufConformance
        run: dotnet format Bead.ProtobufConformance.csproj --verify-no-changes --exclude Generated
      # 1.99.1, as implementations/rust/rust-toolchain.toml names it
      - run: rustup toolchain install
        working-directory: implementations/rust
      # the registry and the Rust testee's build, by its own lock and the toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            implementations/rust/tools/protobuf-conformance/target
          key: protobuf-conformance-rust-${{ hashFiles('implementations/rust/tools/protobuf-conformance/Cargo.lock', 'implementations/rust/rust-toolchain.toml') }}
          restore-keys: protobuf-conformance-rust-
      - name: The suite through the Rust side's codec
        run: node tools/protobuf-conformance.mjs rust
      # the Rust testee lies outside the side's workspace, so its format is held here
      - name: The Rust testee's format
        working-directory: implementations/rust/tools/protobuf-conformance
        run: cargo fmt --check
      - name: One corpus through every side
        run: node tools/protobuf-conformance.mjs differential

  # ── protovalidate differential ───────────────────────────────────────────────
  # spec/validations.json's verdicts and a corpus mutated from them through each side's generated
  # validators and through protovalidate-es, at its pin (decision 0035): the packages
  # `tools/protovalidate-differential/pin.json` pins, fetched and checked by their sha512 before a
  # byte of them is read; the violations compared as protovalidate's own conformance compares them,
  # sorted by rule id then path, a path by its elements, every word and forKey equal. The oracle over
  # the verdicts alone first, then each side's testee. A job of its own, beside the protobuf
  # conformance: it needs every side's runtime, beadc, protoc and protoc-gen-buffa, which no other
  # job has together.
  protovalidate-differential:
    name: protovalidate differential
    needs: scope
    if: contains(fromJSON(needs.scope.outputs.areas), 'protovalidate-differential')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: implementations/dotnet/global.json
          cache: true
          cache-dependency-path: implementations/dotnet/**/packages.lock.json
      - name: Locate the Yarn cache
        id: yarn-cache
        working-directory: builder
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      # The download cache, not `node_modules`: cache what was downloaded, always install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: protovalidate-differential-yarn-cache-${{ runner.os }}-${{ hashFiles('builder/yarn.lock', 'implementations/typescript/yarn.lock') }}
          restore-keys: protovalidate-differential-yarn-cache-${{ runner.os }}-
      # `--immutable` fails if `yarn.lock` would change.
      - run: $YARN install --immutable
        working-directory: implementations/typescript
      - run: $YARN install --immutable
        working-directory: builder
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: builder/.protoc
          key: protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('builder/protoc.json') }}
      # assigned first: a failed fetch fails the step
      - name: protoc, by its pin's sha256
        working-directory: builder
        run: |
          protoc="$(node tools/fetch-protoc.mjs)"
          echo "BEADC_PROTOC=$protoc" >> "$GITHUB_ENV"
      # the oracle's packages, unpacked, by the pin they were checked against
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/protovalidate-differential/.oracle
          key: protovalidate-differential-${{ runner.os }}-${{ hashFiles('tools/protovalidate-differential/pin.json') }}
      - name: protovalidate-es over the verdicts
        run: node tools/protovalidate-differential.mjs oracle
      - name: The corpus through the TypeScript side's validators
        run: node tools/protovalidate-differential.mjs typescript
      - name: The corpus through the C# side's validators
        run: node tools/protovalidate-differential.mjs csharp
      - name: The C# testee's format
        working-directory: implementations/dotnet/tools/Bead.ProtovalidateDifferential
        run: dotnet format Bead.ProtovalidateDifferential.csproj --verify-no-changes --exclude Generated
      # 1.99.1, as implementations/rust/rust-toolchain.toml names it
      - run: rustup toolchain install
        working-directory: implementations/rust
      # the registry and the Rust testee's build, by its own lock and the toolchain
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            implementations/rust/tools/protovalidate-differential/target
          key: protovalidate-differential-rust-${{ hashFiles('implementations/rust/tools/protovalidate-differential/Cargo.lock', 'implementations/rust/rust-toolchain.toml') }}
          restore-keys: protovalidate-differential-rust-
      # assigned first: a failed fetch fails the step
      - name: protoc-gen-buffa, by its pin's sha256
        working-directory: builder
        run: |
          plugin="$(node tools/fetch-protoc-gen-buffa.mjs)"
          echo "BEADC_PROTOC_GEN_BUFFA=$plugin" >> "$GITHUB_ENV"
      - name: The corpus through the Rust side's validators
        run: node tools/protovalidate-differential.mjs rust
      # the Rust testee lies outside the side's workspace, so its format is held here, the code
      # generated into it at run time aside: include!d and rustfmt::skip, rustfmt reads none of it
      - name: The Rust testee's format
        working-directory: implementations/rust/tools/protovalidate-differential
        run: cargo fmt --check

  # ── Commits ──────────────────────────────────────────────────────────────────
  # Every commit subject the push or the pull request brings is a Conventional Commit; merges are
  # left out, git-flow writes them. Then every relative link of the repository's Markdown, and its
  # anchor, resolves; the page site/ builds is the one committed; every version agrees with itself,
  # and a release moves each as its changes owe; the root's tools pass their own tests: here, since
  # the job runs once, on the Node it already has; the root's files keep their format; and the
  # supply chain holds: every action pinned by its commit, no dependency under a known advisory, no
  # code under a blocking rule of Semgrep's. The job runs on every change, outside the scope.
  # `fetch-depth: 0` brings the whole history and every tag, which the subjects' range and each
  # version's last release are read from: a clone without its tags fails the versions' floors.
  commits:
    name: Commits
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check the subjects
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            set -- "$BASE..$HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            set -- "$BEFORE..$AFTER"
          else
            # a new branch (its `before` is all zeros), a push that rewrote the branch (its `before`
            # is a commit no ref holds any more), or a run by hand: what no other branch on the
            # remote holds. Under `--remotes`, `--exclude` matches the name without `refs/remotes/`.
            set -- "$AFTER" --not --exclude="origin/$BRANCH" --remotes=origin
          fi
          node tools/check-commits.mjs "$@"
      - name: Check the links
        run: node tools/check-links.mjs
      # Every test docs/support.md cites, by its file, its class or method, its function or its
      # title, wherever it stands, is one a side's tests declare, an entry a harness names at run
      # time, a case's label or a row, or a literal the tool lists with its reason (decision 0006).
      - name: Check the cited tests
        run: node tools/check-citations.mjs
      - name: Check the details
        run: node tools/check-details.mjs
      # Every count of bytes a side writes into a report, an error or a refusal goes through its
      # helper, "1 byte" at 1, or is a constant above 1 the tool names.
      - name: Check the byte counts
        run: node tools/check-byte-counts.mjs
      # The page beadproto.dev serves is what its build writes from site/, byte for byte, each
      # diagram's SVG its source's render and each icon its mark's, by the hashes they record: no
      # browser, nothing installed.
      - name: Check the page
        run: node site/check.mjs
      # What the page's deploy ships and refuses, by its own tests, in Node's runner: no dependency.
      - name: Test the page's deploy
        run: node --test "site/__tests__/*.test.mjs"
      # Each side's public names, read from its committed surface list, are one on every side or a
      # row of tools/names.tsv says how they render, why one is a side's own, or which row of the
      # support matrix's Differences holds it; the names no reading placed only fall (decision 0047).
      - name: Check the names
        run: node tools/check-names.mjs
      # Every duration an application gives a side through its surface is a place and a way of
      # spec/durations.json, or says why none, in tools/durations.tsv (decision 0014).
      - name: Check the durations' members
        run: node tools/check-durations.mjs
      # Every TypeScript and C# test is played on the Rust side under its title's key, or a row of
      # tools/twins.tsv gives its class and why: a twin under another sentence, ahead for the Rust
      # side, or native to its platform (CLAUDE.md, Parity).
      - name: Check the twins
        run: node tools/check-twins.mjs
      # Each version agrees with itself, the C# lock files' project ranges included, and a released
      # section of the CHANGELOG stays as its tag shipped it; on a release branch, a pull request
      # into main and main, the release moved each version its changes owe, dated its section, and
      # tagged its documents where they belong (decision 0008). On a pull request, `github.ref` is
      # its merge ref, so the head branch names the ref, and a base of main makes it a release.
      - name: Check the versions
        env:
          REF: ${{ github.head_ref || github.ref }}
          BASE: ${{ github.base_ref }}
        run: node tools/check-versions.mjs --ref "$REF" --base "$BASE"
      # The root's tools, by their own tests, in Node's runner: no dependency.
      - name: Test the root's tools
        run: node --test "tools/__tests__/*.test.mjs"
      # The root's own files, from the README to this CI, under the TypeScript side's formatter; the
      # tool holds their list. The conformance files are left to their generators. Here, so that a
      # change of the documents alone, which reaches no other job, is held too: the TypeScript side
      # installed for its formatter.
      - name: Locate the Yarn cache
        id: yarn-cache
        working-directory: implementations/typescript
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('implementations/typescript/yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - run: $YARN install --immutable
        working-directory: implementations/typescript
      - name: Format of the root's files
        run: node tools/check-format.mjs
      # Every action this repository runs, pinned by its commit, its version beside it: a tag
      # moves, and a moved tag runs another's code here.
      - name: Every action pinned by its commit
        run: |
          if grep -rnE '^\s*(-\s*)?uses:\s*[^@]+@' .github/workflows | grep -vE '@[0-9a-f]{40}( #|$)'; then
            echo "::error title=actions::an action above is not pinned by a commit's full sha"
            exit 1
          fi
      # Every dependency of every lockfile, the six yarn.lock, the C# side's packages.lock.json,
      # the Rust side's Cargo.lock and the spec's requirements.txt, against the advisories OSV
      # knows, the scanner at its digest. A known vulnerability fails the job, but one
      # osv-scanner.toml leaves out with its reason, until the date it is read again.
      - name: The dependencies, against the known advisories
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
          scan source --config /src/osv-scanner.toml --recursive /src
      # Semgrep's community rules for TypeScript, C#, GitHub Actions and secrets, the scanner at
      # its digest, the generated folders and the goldens left out: a blocking finding fails the
      # job. ! The rules are the registry's, fetched at the run: a rule added there may fail a
      # commit that changed nothing, which is read as a finding, never as a flake. ! The eight
      # private keys of the test PKI are left out by name, each one alone, never their folder: they
      # are published test keys, and spec/check.py's TEST_PKI_KEYS holds each file to its own key,
      # so a key added there or changed fails that gate rather than passing this one unseen.
      - name: The code, under Semgrep's community rules
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src
          semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
          semgrep scan --config p/typescript --config p/csharp --config p/github-actions --config p/secrets
          --metrics=off --error --exclude node_modules --exclude builder/test/golden
          --exclude '**/Generated' --exclude '**/generated' --exclude '**/dist' --exclude .claude
          --exclude spec/pki/root.key --exclude spec/pki/intermediate.key --exclude spec/pki/client.key
          --exclude spec/pki/server.key --exclude spec/pki/stranger-client.key
          --exclude spec/pki/stranger-server.key --exclude spec/pki/named-server.key
          --exclude spec/pki/addressed-server.key

  # ── Site ─────────────────────────────────────────────────────────────────────
  # The page beadproto.dev serves and its not-found page, as committed, laid out in Chromium by
  # site/layout.mjs: the top bar on one line at every width, in both languages and both themes, no
  # page wider than a phone, a finger's targets, the code's size, the menu and the theme. The image
  # of the site's own `playwright-core` holds the Chromium it drives, so a pull request that moves
  # one folder's Playwright alone still finds its browser.
  site:
    name: Site
    needs: [scope, playwright]
    if: contains(fromJSON(needs.scope.outputs.areas), 'site')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.site }}-resolute
      options: --ipc=host
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: $YARN install --immutable
      - name: The page's layout
        run: node layout.mjs

  # ── CI ok ────────────────────────────────────────────────────────────────────
  # The one check that stands for every job: green when the scope passed, every job in it passed and
  # every job out of it was skipped, red otherwise. A job in scope that was cancelled, or skipped
  # because a job it needs failed, is red; tools/ci-scope.mjs --verdict holds each result to its
  # scope.
  ci-ok:
    name: CI ok
    if: always()
    needs:
      [
        scope,
        spec,
        playwright,
        typescript,
        typescript-apps,
        typescript-coverage,
        dotnet,
        rust,
        rust-lints,
        rust-coverage,
        rust-fuzz,
        rust-windows,
        interop-rust,
        mqtt,
        mqtt-rust,
        amqp,
        builder,
        builder-image,
        examples,
        protobuf-conformance,
        protovalidate-differential,
        commits,
        site,
      ]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci-scope.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Each job as its scope asks
        env:
          NEEDS: ${{ toJSON(needs) }}
          AREAS: ${{ needs.scope.outputs.areas }}
        run: node tools/ci-scope.mjs --verdict
