name: CI

# Every job on every push and pull request: the spec is shared, so a change anywhere can break
# either side. `ci-ok` stands for every job; it fails when any other job did not pass. Branch
# protection, which would make it the one check a branch requires, waits on GitHub Pro or a public
# repository.
on:
  # Branches only: a tag pushed by a release points at a commit its branch's run already checked.
  push:
    branches: ['**']
  pull_request:
  # The suite against an unchanged tree, which is how a flake is told from a failure.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A CI pins: the runner's image by its release, never `ubuntu-latest`, and Node by its line. Node
  # is the current line; `engines.node` in the TypeScript side's manifest declares a floor, and the
  # TypeScript job runs on it too.
  NODE_VERSION: '26'
  # The vendored release, invoked as a file: no Corepack, and the runner's own Yarn 1.22 refuses a
  # project declaring `packageManager: yarn@4.18.1`.
  YARN: node .yarn/releases/yarn-4.18.1.cjs
  # The TypeScript suite is unit tests without a browser: nothing to download.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  # ── Spec ─────────────────────────────────────────────────────────────────────
  # The conformance files are what their generators write: regenerated, they must come out
  # identical to the committed ones, byte for byte. Then spec/check.py, from its hash-locked
  # dependencies: each file under its schema, the version of its document, the spec's sections and
  # the vector groups naming each other, the companion's expositions read as 0.0.4, each side's
  # tests reading every group, and each count the tables of files of docs/support.md and the README
  # state.
  spec:
    name: Spec
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.9'
      # ! before the generators: make_validations.py matches its patterns by google-re2
      - run: >-
          python -m pip install --disable-pip-version-check -q --require-hashes --only-binary=:all:
          -r spec/requirements.txt
      - run: python spec/generators/make_vectors.py
      - run: python spec/generators/make_conversations.py
      - run: python spec/generators/make_transports.py
      - run: python spec/generators/make_clocks.py
      - run: python spec/generators/make_durations.py
      - run: python spec/generators/make_debug_filters.py
      - run: python spec/generators/make_metrics.py
      - run: python spec/generators/make_codecs.py
      - run: python spec/generators/make_identities.py
      - run: python spec/generators/make_validations.py
      - run: python spec/generators/make_transcoding.py
      - run: git diff --exit-code -- spec
      - name: No file the generators wrote is new
        run: test -z "$(git status --porcelain -- spec)"
      - run: python spec/check.py

  # ── Playwright ───────────────────────────────────────────────────────────────
  # The version of `@playwright/test` the TypeScript side pins, which names Microsoft's image of it:
  # the jobs that run a browser run in that image, Chromium and what it needs already there, so no
  # job installs a browser, and no copy of the version stands anywhere else.
  playwright:
    name: Playwright's version
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: implementations/typescript/package.json
          sparse-checkout-cone-mode: false
      # ! an exact version alone names an image: a range names none
      - id: version
        run: >-
          node -e "const v = require('./implementations/typescript/package.json').devDependencies['@playwright/test'];
          if (!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(v)) { throw new Error('@playwright/test is ' + v + ', no exact version'); }
          console.log('version=' + v)" >> "$GITHUB_OUTPUT"

  # ── TypeScript ───────────────────────────────────────────────────────────────
  # The TypeScript side's own gate: types, lint and its plugin's cases, format, comment budget, doc
  # examples, the generated `Probe` held to its generator, the generated interop's types and lint,
  # then its tests, on the current line under coverage, held to the side's floor. The interop
  # against the C# server runs in the .NET job. On the current line and on the floor
  # `engines.node` declares, so the floor holds by a run.
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    needs: playwright
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # the image of the Playwright the side pins, Chromium in it: no browser to install
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-resolute
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        node: ['26', '24.9']
    defaults:
      run:
        working-directory: implementations/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      # The download cache, not `node_modules`: cache what was downloaded, always install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-cache-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('implementations/typescript/yarn.lock') }}
          restore-keys: yarn-cache-${{ runner.os }}-node${{ matrix.node }}-
      # `--immutable` fails if `yarn.lock` would change.
      - run: $YARN install --immutable
      - run: $YARN check
      - if: matrix.node != '26'
        run: $YARN test --grep-invert "the C# server of the interop service"
      # On the current line, the same tests under c8, then what they ran held to the TypeScript
      # side's floor in tools/coverage-floors.json, the report in the run's summary.
      - if: matrix.node == '26'
        run: $YARN test:coverage --grep-invert "the C# server of the interop service"
      - if: matrix.node == '26'
        name: Coverage, held to its floor
        working-directory: .
        run: >-
          node tools/coverage-report.mjs implementations/typescript/coverage/coverage-final.json
          --under implementations/typescript/src --floor typescript --summary "$GITHUB_STEP_SUMMARY"
      # the report to browse, c8's HTML and its lcov, kept with the run whether the floor held or not
      - if: ${{ !cancelled() && matrix.node == '26' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-typescript
          path: implementations/typescript/coverage/
          retention-days: 14
      # The demo's static build, the folder francisdesjardins.ca serves: bundling it is the check.
      - run: $YARN playground:build:file
      # The DevTools extension, built, then tested on the current line: its pure modules, and itself
      # loaded in Chromium against the static build above, the image's own browser.
      - run: $YARN devtools:build
      - if: matrix.node == '26'
        run: $YARN test:devtools
      # The demo's own tests on the current line: its procedures in Node, and its page, the static
      # build above, in Chromium.
      - if: matrix.node == '26'
        run: $YARN test:demo
      # The root's own files, from the README to this CI, under the TypeScript side's formatter; the
      # tool holds their list. The conformance files are left to their generators.
      - name: Format of the root's files
        working-directory: .
        run: node tools/check-format.mjs

  # ── .NET ─────────────────────────────────────────────────────────────────────
  # The C# side's gate — `dotnet format --verify-no-changes` holds the layout, the code style and
  # the analyzers, the generated folders left to their generator; `dotnet build` builds every
  # project with every warning an error, the builder's C# goldens among them, which `Bead.Goldens`
  # compiles under this side's rules as a consumer compiles them; `dotnet test` runs the tests under
  # coverage, held to the side's floor — and the interop, both ways: the C# client against the
  # TypeScript server, which `dotnet test` starts with Node, then the TypeScript client against the
  # C# server; then a page of another origin in Chromium against both sides' HTTP servers, what
  # proves a browser reads their CORS answer. Only the TypeScript side is installed, for its interop
  # server and its page; Chromium is the Playwright image's.
  #
  # `BEAD_INTEROP_REQUIRED=1` turns an interop that would skip into one that fails: here a skip
  # could only be a path to the other side gone wrong.
  #
  # From `implementations/dotnet`: `dotnet` finds `global.json`, which holds the SDK and the test
  # runner, by walking up from where it runs. `CI=true` turns on `RestoreLockedMode` in
  # `Directory.Build.props`: a restore that would change a `packages.lock.json` fails.
  dotnet:
    name: .NET
    needs: playwright
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # the image of the Playwright the TypeScript side pins, for the page of another origin's Chromium
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-resolute
      options: --ipc=host
    env:
      BEAD_INTEROP_REQUIRED: 1
    defaults:
      run:
        working-directory: implementations/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: implementations/dotnet/global.json
          cache: true
          cache-dependency-path: implementations/dotnet/**/packages.lock.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: $YARN install --immutable
        working-directory: implementations/typescript
      - run: dotnet format Bead.slnx --verify-no-changes --exclude ../../builder/test/golden/csharp interop/Bead.Interop/Generated tests/Bead.Protobuf.Tests/Generated
      # every project, which `dotnet test` does not: it builds the test projects alone
      - run: dotnet build Bead.slnx
      # the tests under coverage, one cobertura report per test project, then what they ran held to
      # the C# side's floor in tools/coverage-floors.json, the report in the run's summary
      - run: >-
          dotnet test --solution Bead.slnx --coverage --coverage-output-format cobertura
          --results-directory TestResults/coverage
      - name: Coverage, held to its floor
        run: >-
          node ../../tools/coverage-report.mjs TestResults/coverage/*.cobertura.xml
          --under implementations/dotnet/src --floor csharp --summary "$GITHUB_STEP_SUMMARY"
      # each test project's cobertura report, kept with the run whether the floor held or not
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-csharp
          path: implementations/dotnet/TestResults/coverage/*.cobertura.xml
          retention-days: 14
      - run: $YARN test:interop
        working-directory: implementations/typescript
      - run: $YARN test:browser
        working-directory: implementations/typescript

  # ── Builder ──────────────────────────────────────────────────────────────────
  # beadc's own gate, from builder/, its toolchain its own. On Linux: types, the goldens' types,
  # lint, format, buf's lint and format over its options and its fixtures, and the options'
  # generated code held to its generator, none of which a platform moves. On every leg: protoc, the
  # one `protoc.json` pins, fetched and checked by its sha256, then its tests, the interop's .proto
  # among them, whose blueprint is the spec's byte for byte in either line ending, and the goldens of
  # both targets, protoc's C# messages among them; then beadc itself over the interop's blueprint,
  # its rules and its form, then each side's interop to what beadc generates from the root's
  # `beadc.yaml`, and the demo's sign-up service to what it generates from the demo's, then, on
  # Linux, `beadc breaking`, the interop's blueprint and `examples/hello`
  # against the last release that carries one, from 0.3.0. On Windows, where buf and protoc are
  # other binaries, on the current line; on Linux, on the floor `engines.node` declares too. The C#
  # goldens build in the .NET job, which has the SDK. The wrappers, `beadc.sh` and `beadc.ps1`, are
  # held to one contract on every leg, against a stand-in engine. On the image's legs, Linux on
  # Node 26, amd64 and arm64, each natively: beadc's image built from `builder/Dockerfile`, its test
  # stage built on the image itself, so beadc's tests run once on the image's Node, protoc and
  # environment, then once more from `builder/`, where each wrapper runs the image it built, over
  # the repository's projects and `examples/hello`; and the wrappers' lint, each linter at its pin.
  #
  # `BEADC_PROTOC_REQUIRED=1` turns a test that would skip without protoc into one that fails: here a
  # skip could only be a fetch gone wrong.
  builder:
    name: Builder (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BEADC_PROTOC_REQUIRED: 1
      # a wrapper's test that would skip without bash, pwsh 7.6 or, on Windows, the right to make a
      # symbolic link fails: every runner has them
      BEADC_WRAPPERS_REQUIRED: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
        node: ['26']
        include:
          - os: ubuntu-26.04
            node: '24.9'
          # the image, on each architecture natively: the first include marks the Linux Node 26
          # leg, which GitHub merges, adding no leg
          - os: ubuntu-26.04
            node: '26'
            image: true
          # ! arm64 natively, on every push: its own leg, counted against the account's minutes in a
          # private repository; taken out, the image is amd64's alone until a release builds arm64
          - os: ubuntu-26.04-arm
            node: '26'
            image: true
    defaults:
      run:
        working-directory: builder
        # Git Bash on Windows, so `$YARN` and every step read alike on both
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      # The download cache, not `node_modules`: cache what was downloaded, always install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: builder-yarn-cache-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-${{ hashFiles('builder/yarn.lock') }}
          restore-keys: builder-yarn-cache-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-
      # `--immutable` fails if `yarn.lock` would change.
      - run: $YARN install --immutable
      # protoc's archive, extracted, by the pin it was checked against
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: builder/.protoc
          key: protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('builder/protoc.json') }}
      # assigned first: a failed fetch fails the step, which a substitution inside echo's arguments
      # would not
      - name: protoc, by its pin's sha256
        run: |
          protoc="$(node tools/fetch-protoc.mjs)"
          echo "BEADC_PROTOC=$protoc" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: $YARN check
      # the image's test stage first, then the image, which reuses every stage but the last; the
      # tests after it run each wrapper against it
      - if: matrix.image
        name: The image, its test stage first
        working-directory: .
        run: |
          docker build -f builder/Dockerfile --target test .
          docker build -f builder/Dockerfile -t beadc:ci .
          echo "BEADC_IMAGE=beadc:ci" >> "$GITHUB_ENV"
          echo "BEADC_IMAGE_REQUIRED=1" >> "$GITHUB_ENV"
      # shellcheck from its image by digest, PSScriptAnalyzer at its version: a new default rule
      # reaches the wrappers by a change of a pin, never by a runner's update
      - if: matrix.image
        name: The wrappers' lint, each linter at its pin
        run: |
          docker run --rm -v "$PWD/wrappers:/mnt:ro" koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d -S style /mnt/beadc.sh
          pwsh -NoProfile -Command '
            if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object Version -eq ([version] "1.25.0"))) {
              Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
            }
            Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
            Invoke-ScriptAnalyzer -Path wrappers/beadc.ps1 -EnableExit'
      - run: $YARN test
      - name: The interop's blueprint, to beadc's rules
        run: node src/cli.ts check ../spec/interop-blueprint.json
      - name: The interop's blueprint, in its form
        run: node src/cli.ts blueprint --check ../spec/interop-blueprint.json
      - name: Each side's interop, what beadc generates from its blueprint
        working-directory: .
        run: node builder/src/cli.ts generate --check
      - name: The demo's sign-up service, what beadc generates from its .proto
        working-directory: implementations/typescript/demo
        run: node ../../../builder/src/cli.ts generate --check
      - name: Each side's validators of spec/validations.proto, what beadc generates for it
        working-directory: .
        run: node tools/check-validations.mjs
      - name: Each side's route table and document of spec/transcoding.proto, what beadc generates for it
        working-directory: .
        run: node tools/check-transcoding.mjs
      # ! beadc breaking, against the last release, the interop's blueprint and examples/hello's:
      # the last release carries both, and one without fails the step, so it never passes by
      # comparing nothing. The last release is the newest
      # vX.Y.Z, as tools/release.mjs reads one, whose commit is not HEAD's: on a release's own
      # commit, the one before it, so a waiver the release carried still waives its change. Read by
      # the tag's commit, never by ancestry, which the shallow fetch does not hold. Every warning
      # fails, WAIVER_UNUSED's among them: a waiver that waived nothing is taken out
      - if: runner.os == 'Linux'
        name: The interop's blueprint and examples/hello, against the last release
        working-directory: .
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          head="$(git rev-parse HEAD)"
          tag=""
          for each in $(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V -r); do
            if [ "$(git rev-parse "$each^{commit}")" != "$head" ]; then
              tag="$each"
              break
            fi
          done
          if [ -z "$tag" ] || ! git cat-file -e "$tag:spec/interop-blueprint.json" 2> /dev/null; then
            echo "::error title=beadc breaking::${tag:-no v* tag} carries no spec/interop-blueprint.json"
            exit 1
          fi
          git archive --format=tar "$tag" | node builder/src/cli.ts breaking --against - --error-format github --fail-on-warning
          cd examples/hello
          git archive --format=tar "$tag" | node ../../builder/src/cli.ts breaking --against - --error-format github --fail-on-warning

  # ── Examples ─────────────────────────────────────────────────────────────────
  # Each project of examples/, written as a consumer writes one, its runtimes from their source: a
  # Yarn portal and a ProjectReference. First what the examples copy or take from beadc, held to
  # their source; then examples/hello: beadc on Node from builder/ holds its generated files and
  # writes the copy of Bead's options its external builds read; buf's lint and layout over its
  # .proto; each half's gates and both its builds; then each client against each server, both
  # modes of each half, sixteen pairs, each server's gateway asked after its client, every one
  # writing transcript.txt, every server ending clean.
  # On the current line and on the floor the TypeScript half's engines.node declares. The wrappers
  # run over it on the builder job's image legs, where the image is.
  examples:
    name: Examples (Node ${{ matrix.node }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['26', '24.9']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: examples/hello/dotnet/global.json
          cache: true
          cache-dependency-path: |
            examples/*/dotnet/packages.lock.json
            implementations/dotnet/src/**/packages.lock.json
      - name: Locate the Yarn cache
        id: yarn-cache
        working-directory: builder
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      # The download cache, not `node_modules`: cache what was downloaded, always install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: examples-yarn-cache-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('builder/yarn.lock', 'examples/*/typescript/yarn.lock') }}
          restore-keys: examples-yarn-cache-${{ runner.os }}-node${{ matrix.node }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: builder/.protoc
          key: protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('builder/protoc.json') }}
      # `--immutable` fails if `yarn.lock` would change.
      - run: $YARN install --immutable
        working-directory: builder
      # assigned first: a failed fetch fails the step
      - name: protoc, by its pin's sha256
        working-directory: builder
        run: |
          protoc="$(node tools/fetch-protoc.mjs)"
          echo "BEADC_PROTOC=$protoc" >> "$GITHUB_ENV"
      - name: What each example copies, or takes from beadc's wrapper and init
        run: node tools/check-examples.mjs
      # held first, then written: generate writes the same files again, and the copy of Bead's
      # options, git's to ignore, which buf and Grpc.Tools read
      - name: hello's generated files, what beadc writes
        working-directory: examples/hello
        run: |
          node ../../builder/src/cli.ts generate --check
          node ../../builder/src/cli.ts generate
          git diff --exit-code
      - run: $YARN install --immutable
        working-directory: examples/hello/typescript
      - name: hello's .proto, buf's lint and layout
        working-directory: examples/hello
        run: |
          typescript/node_modules/.bin/buf lint
          typescript/node_modules/.bin/buf format --diff --exit-code
      - run: $YARN check
        working-directory: examples/hello/typescript
      - run: $YARN build && $YARN build:external
        working-directory: examples/hello/typescript
      - run: dotnet format Hello.csproj --verify-no-changes --exclude gen
        working-directory: examples/hello/dotnet
      - run: dotnet build && dotnet build -p:HelloMessages=external
        working-directory: examples/hello/dotnet
        env:
          CI: true
      - name: Each client against each server
        run: node examples/hello/pairs.mjs

  # ── Protobuf conformance ─────────────────────────────────────────────────────
  # Protobuf's conformance suite through each side's generated `proto` codec, the check of a
  # payload's records in front of its library, and its mapping of protobuf's JSON, binary and JSON,
  # recommended enforced, every edition, at the release both libraries pin (decisions 0028 and
  # 0037): the runner `tools/protobuf-conformance/runner.json`
  # pins, fetched and checked by its sha512 as protoc is by its sha256, against each side's testee
  # and its failure list, which the runner holds both ways, then the floor of tests run; then one
  # corpus of Probe through both testees, read alike. A job of its own: it needs both runtimes,
  # beadc and protoc, which no other job has together. The C# testee lies outside Bead.slnx, so its
  # format is held here, by name, the code generated into it at run time aside; `CI=true`, the
  # runner's own, restores it locked.
  protobuf-conformance:
    name: Protobuf conformance
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: implementations/dotnet/global.json
          cache: true
          cache-dependency-path: implementations/dotnet/**/packages.lock.json
      - name: Locate the Yarn cache
        id: yarn-cache
        working-directory: builder
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      # The download cache, not `node_modules`: cache what was downloaded, always install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: protobuf-conformance-yarn-cache-${{ runner.os }}-${{ hashFiles('builder/yarn.lock', 'implementations/typescript/yarn.lock') }}
          restore-keys: protobuf-conformance-yarn-cache-${{ runner.os }}-
      # `--immutable` fails if `yarn.lock` would change.
      - run: $YARN install --immutable
        working-directory: implementations/typescript
      - run: $YARN install --immutable
        working-directory: builder
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: builder/.protoc
          key: protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('builder/protoc.json') }}
      # assigned first: a failed fetch fails the step
      - name: protoc, by its pin's sha256
        working-directory: builder
        run: |
          protoc="$(node tools/fetch-protoc.mjs)"
          echo "BEADC_PROTOC=$protoc" >> "$GITHUB_ENV"
      # the runner's package, unpacked, by the pin it was checked against
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/protobuf-conformance/.runner
          key: protobuf-conformance-${{ runner.os }}-${{ hashFiles('tools/protobuf-conformance/runner.json') }}
      - name: The suite through the TypeScript side's codec
        run: node tools/protobuf-conformance.mjs typescript
      - name: The suite through the C# side's codec
        run: node tools/protobuf-conformance.mjs csharp
      - name: The C# testee's format
        working-directory: implementations/dotnet/tools/Bead.ProtobufConformance
        run: dotnet format Bead.ProtobufConformance.csproj --verify-no-changes --exclude Generated
      - name: One corpus through both sides
        run: node tools/protobuf-conformance.mjs differential

  # ── protovalidate differential ───────────────────────────────────────────────
  # spec/validations.json's verdicts and a corpus mutated from them through each side's generated
  # validators and through protovalidate-es, at its pin (decision 0035): the packages
  # `tools/protovalidate-differential/pin.json` pins, fetched and checked by their sha512 before a
  # byte of them is read; the violations compared as protovalidate's own conformance compares them,
  # sorted by rule id then path, a path by its elements, every word and forKey equal. The oracle over
  # the verdicts alone first, then each side's testee. A job of its own, beside the protobuf
  # conformance: it needs both runtimes, beadc and protoc, which no other job has together.
  protovalidate-differential:
    name: protovalidate differential
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: implementations/dotnet/global.json
          cache: true
          cache-dependency-path: implementations/dotnet/**/packages.lock.json
      - name: Locate the Yarn cache
        id: yarn-cache
        working-directory: builder
        run: echo "dir=$($YARN config get cacheFolder)" >> "$GITHUB_OUTPUT"
      # The download cache, not `node_modules`: cache what was downloaded, always install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: protovalidate-differential-yarn-cache-${{ runner.os }}-${{ hashFiles('builder/yarn.lock', 'implementations/typescript/yarn.lock') }}
          restore-keys: protovalidate-differential-yarn-cache-${{ runner.os }}-
      # `--immutable` fails if `yarn.lock` would change.
      - run: $YARN install --immutable
        working-directory: implementations/typescript
      - run: $YARN install --immutable
        working-directory: builder
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: builder/.protoc
          key: protoc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('builder/protoc.json') }}
      # assigned first: a failed fetch fails the step
      - name: protoc, by its pin's sha256
        working-directory: builder
        run: |
          protoc="$(node tools/fetch-protoc.mjs)"
          echo "BEADC_PROTOC=$protoc" >> "$GITHUB_ENV"
      # the oracle's packages, unpacked, by the pin they were checked against
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/protovalidate-differential/.oracle
          key: protovalidate-differential-${{ runner.os }}-${{ hashFiles('tools/protovalidate-differential/pin.json') }}
      - name: protovalidate-es over the verdicts
        run: node tools/protovalidate-differential.mjs oracle
      - name: The corpus through the TypeScript side's validators
        run: node tools/protovalidate-differential.mjs typescript
      - name: The corpus through the C# side's validators
        run: node tools/protovalidate-differential.mjs csharp
      - name: The C# testee's format
        working-directory: implementations/dotnet/tools/Bead.ProtovalidateDifferential
        run: dotnet format Bead.ProtovalidateDifferential.csproj --verify-no-changes --exclude Generated

  # ── Commits ──────────────────────────────────────────────────────────────────
  # Every commit subject the push or the pull request brings is a Conventional Commit; merges are
  # left out, git-flow writes them. Then every relative link of the repository's Markdown, and its
  # anchor, resolves; every version agrees with itself, and a release moves each as its changes owe;
  # the root's tools pass their own tests: here, since the job runs once, on the Node it already
  # has; and the supply chain holds: every action pinned by its commit, no dependency under a known
  # advisory, no code under a blocking rule of Semgrep's. `fetch-depth: 0` brings the whole history and every tag, which the subjects' range and each
  # version's last release are read from: a clone without its tags fails the versions' floors.
  commits:
    name: Commits
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check the subjects
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            set -- "$BASE..$HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            set -- "$BEFORE..$AFTER"
          else
            # a new branch (its `before` is all zeros), a push that rewrote the branch (its `before`
            # is a commit no ref holds any more), or a run by hand: what no other branch on the
            # remote holds. Under `--remotes`, `--exclude` matches the name without `refs/remotes/`.
            set -- "$AFTER" --not --exclude="origin/$BRANCH" --remotes=origin
          fi
          node tools/check-commits.mjs "$@"
      - name: Check the links
        run: node tools/check-links.mjs
      - name: Check the details
        run: node tools/check-details.mjs
      # Each version agrees with itself, the C# lock files' project ranges included, and a released
      # section of the CHANGELOG stays as its tag shipped it; on a release branch, a pull request
      # into main and main, the release moved each version its changes owe, dated its section, and
      # tagged its documents where they belong (decision 0008). On a pull request, `github.ref` is
      # its merge ref, so the head branch names the ref, and a base of main makes it a release.
      - name: Check the versions
        env:
          REF: ${{ github.head_ref || github.ref }}
          BASE: ${{ github.base_ref }}
        run: node tools/check-versions.mjs --ref "$REF" --base "$BASE"
      # The root's tools, by their own tests, in Node's runner: no dependency.
      - name: Test the root's tools
        run: node --test "tools/__tests__/*.test.mjs"
      # Every action this repository runs, pinned by its commit, its version beside it: a tag
      # moves, and a moved tag runs another's code here.
      - name: Every action pinned by its commit
        run: |
          if grep -rnE '^\s*(-\s*)?uses:\s*[^@]+@' .github/workflows | grep -vE '@[0-9a-f]{40}( #|$)'; then
            echo "::error title=actions::an action above is not pinned by a commit's full sha"
            exit 1
          fi
      # Every dependency of every lockfile, the five yarn.lock, the C# side's packages.lock.json
      # and the spec's requirements.txt, against the advisories OSV knows, the scanner at its
      # digest. A known vulnerability fails the job.
      - name: The dependencies, against the known advisories
        run: >-
          docker run --rm -v "$PWD:/src:ro"
          ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0
          scan source --recursive /src
      # Semgrep's community rules for TypeScript, C#, GitHub Actions and secrets, the scanner at
      # its digest, the generated folders and the goldens left out: a blocking finding fails the
      # job. ! The rules are the registry's, fetched at the run: a rule added there may fail a
      # commit that changed nothing, which is read as a finding, never as a flake.
      - name: The code, under Semgrep's community rules
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src
          semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
          semgrep scan --config p/typescript --config p/csharp --config p/github-actions --config p/secrets
          --metrics=off --error --exclude node_modules --exclude builder/test/golden
          --exclude '**/Generated' --exclude '**/generated' --exclude '**/dist' --exclude .claude

  # ── CI ok ────────────────────────────────────────────────────────────────────
  # The one check that stands for every job: green when every job above passed, red otherwise,
  # including when one was cancelled or skipped.
  ci-ok:
    name: CI ok
    if: always()
    needs:
      [
        spec,
        playwright,
        typescript,
        dotnet,
        builder,
        examples,
        protobuf-conformance,
        protovalidate-differential,
        commits,
      ]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
