name: Fuzz

# A fuzzing campaign of every target, every week and by hand, never a pull request's gate (decision
# 0006): ClusterFuzzLite's batch mode, its `fuzz-seconds` of 600 a target, run by tools/fuzz.mjs
# since OSS-Fuzz runs no .NET. Windows runs the TypeScript targets under Jazzer.js and the C# ones
# under libfuzzer-dotnet, at tools/fuzz/fuzzer.json's pin; Linux the Rust ones under cargo-fuzz, on
# the nightly tools/fuzz.mjs pins. Each side's corpus is kept between runs in the cache, grown from
# the conformance files' seeds; its findings are uploaded, and fail the run. `tools/release.mjs
# prepare` owes the last run's reading to every release, and a finding becomes a case of its side's
# tests.
on:
  schedule:
    # Mondays, 06:17 UTC
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read

env:
  # CI's Node, by its line
  NODE_VERSION: '26'

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────────
  # The TypeScript side's targets and beadc's `blueprint`, then the C# side's, each side its own
  # leg: Jazzer.js installed into each folder of targets from its own lock, libfuzzer-dotnet and
  # SharpFuzz's instrumenter fetched by their pin.
  windows:
    name: Fuzz (${{ matrix.side }})
    runs-on: windows-2025
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: typescript
            corpus: |
              implementations/typescript/tools/fuzz/corpus
              builder/tools/fuzz/corpus
            findings: |
              implementations/typescript/tools/fuzz/findings/
              builder/tools/fuzz/findings/
          - side: csharp
            corpus: implementations/dotnet/tools/Bead.Fuzz/corpus
            findings: implementations/dotnet/tools/Bead.Fuzz/findings/
    defaults:
      run:
        # Git Bash, so every step reads alike on each leg
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: matrix.side == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: implementations/dotnet/global.json
          cache: true
          cache-dependency-path: implementations/dotnet/**/packages.lock.json
      # the side's install, beadc's, and Jazzer.js in each folder of targets, every one by its lock
      - if: matrix.side == 'typescript'
        name: The installs the bundles and Jazzer.js read
        run: |
          (cd implementations/typescript && node .yarn/releases/yarn-4.18.1.cjs install --immutable)
          (cd builder && node .yarn/releases/yarn-4.18.1.cjs install --immutable)
          (cd implementations/typescript/tools/fuzz && node ../../.yarn/releases/yarn-4.18.1.cjs install --immutable)
          (cd builder/tools/fuzz && node ../../.yarn/releases/yarn-4.18.1.cjs install --immutable)
      - if: matrix.side == 'csharp'
        run: node tools/fuzz.mjs fetch
      # the corpus the last campaign grew, the newest whose key the side's prefix opens
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.corpus }}
          key: fuzz-corpus-${{ matrix.side }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.side }}-
      - run: node tools/fuzz.mjs seed
      - run: node tools/fuzz.mjs build "$SIDE"
        env:
          SIDE: ${{ matrix.side }}
      # ! every target runs its ten minutes, a finding of one keeping no other from its run
      - run: node tools/fuzz.mjs campaign "$SIDE" -- -max_total_time=600
        env:
          SIDE: ${{ matrix.side }}
      # what this campaign grew, kept for the next, whether it found something or not
      - if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.corpus }}
          key: fuzz-corpus-${{ matrix.side }}-${{ github.run_id }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.side }}
          path: ${{ matrix.findings }}
          if-no-files-found: ignore
          retention-days: 30

  # ── Rust ─────────────────────────────────────────────────────────────────────
  # The Rust side's targets under cargo-fuzz, on the nightly its sanitizer needs, the one
  # tools/fuzz.mjs pins by its date and CI's fuzz build takes: every twin, and `mqtt-packets` and
  # `mqtt-websocket-frames`, its MQTT 5 client's readers of a broker's packets and of a WebSocket's
  # frames, its alone. Ten targets of ten minutes each, so the other sides' bound.
  rust:
    name: Fuzz (rust)
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # the nightly read from tools/fuzz.mjs, its one place in this workflow
      - name: The nightly tools/fuzz.mjs pins
        run: |
          nightly="$(node --input-type=module -e "import { RUST_NIGHTLY } from './tools/fuzz.mjs'; process.stdout.write(RUST_NIGHTLY);")"
          echo "NIGHTLY=$nightly" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            implementations/rust/fuzz/target
          key: fuzz-rust-${{ env.NIGHTLY }}-${{ hashFiles('implementations/rust/fuzz/Cargo.lock') }}
          restore-keys: fuzz-rust-${{ env.NIGHTLY }}-
      # cargo-fuzz from its source on crates.io, by its lock, as CI's fuzz build installs it
      - run: cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: implementations/rust/fuzz/corpus
          key: fuzz-corpus-rust-${{ github.run_id }}
          restore-keys: fuzz-corpus-rust-
      - run: node tools/fuzz.mjs seed
      - run: node tools/fuzz.mjs build rust
      # ! every target runs its ten minutes, a finding of one keeping no other from its run
      - run: node tools/fuzz.mjs campaign rust -- -max_total_time=600
      - if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: implementations/rust/fuzz/corpus
          key: fuzz-corpus-rust-${{ github.run_id }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-rust
          path: implementations/rust/fuzz/findings/
          if-no-files-found: ignore
          retention-days: 30
