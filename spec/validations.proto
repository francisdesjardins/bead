  // Judges a Patterns, and answers nothing more.
  rpc JudgePatterns(Patterns) returns (Taken) {
    option (bead.procedure) = {id: 13};
  }
}

// What a procedure answers a request its rules take: nothing.
message Taken {}

// A colour, by its number, the enum the rules on an enum judge.
enum Colour {
  COLOUR_UNSPECIFIED = 0;
  COLOUR_RED = 1;
  COLOUR_GREEN = 2;
}

// A message the others hold: its name, one character at least.
message Inner {
  string name = 1 [features.field_presence = IMPLICIT, (buf.validate.field) = {string: {min_len: 1}}];
}

